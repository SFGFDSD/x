const Settings = {
  data: {
    theme:'dark', accent:'#ff9d2e', radius:3, railSide:'left', railWidth:68,
    clock12:true, clockShowSec:false, wallpaper:'wp-steel',
    customWallpaper:null, defaultBackend:'opfs', hideSystemApps:false,
    animations:true, gridSnap:true, showGrid:false, iconSize:88,
    deskIconPos:{}, windowAnim:true, density:'normal', fontFamily:'default'
  },
  async load(){
    let loaded = false;
    try{ const s = await IDB.get('kv','settings'); if(s){ Object.assign(this.data, s); loaded = true; } }catch(e){}
    try{
      const ls = JSON.parse(localStorage.getItem('rivet-settings') || '{}');
      if(Object.keys(ls).length){ Object.assign(this.data, ls); loaded = true; }
    }catch(e){}
    // 首次运行：桌面端默认左侧铆钉导轨，移动端默认底部 Dock
    if(!loaded && innerWidth <= 880) this.data.railSide = 'bottom';
    return this.data;
  },
  async save(){
    try{ await IDB.put('kv', this.data, 'settings'); }catch(e){}
    try{ localStorage.setItem('rivet-settings', JSON.stringify(this.data)); }catch(e){}
    applySettings();
  }
};
/* ═══════════════════════════════════════════════════════════
   5. 全局 UI：提示 / 弹窗
   ═══════════════════════════════════════════════════════════ */
function toast(msg, kind = '', ms = 2800){
  const t = el('div', 'toast ' + kind, `<span style="color:var(--${kind==='err'?'danger':kind==='ok'?'phos':'amber'})">${kind==='err'?ICONS.x:kind==='ok'?ICONS.check:ICONS.info}</span><span>${msg}</span>`);
  $('#toastWrap').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 240); }, ms);
}
function modal({ title, body, buttons = [] }){
  return new Promise(res => {
    const wrap = $('#modalWrap');
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = typeof body === 'string' ? `<p>${body}</p>` : '';
    if(typeof body !== 'string') $('#modalBody').appendChild(body);
    const foot = $('#modalFoot'); foot.innerHTML = '';
    const done = v => { wrap.classList.remove('open'); res(v); };
    for(const b of buttons){
      const btn = el('button', 'btn ' + (b.kind || ''), b.label);
      btn.onclick = () => done(b.value);
      foot.appendChild(btn);
    }
    wrap.classList.add('open');
  });
}
function promptModal(title, label, value = '', okLabel = '确认'){
  return new Promise(res => {
    const box = el('div');
    box.innerHTML = `<div class="stencil" style="margin-bottom:8px">${label}</div>`;
    const inp = el('input', 'input');
    inp.style.width = '100%'; inp.value = value;
    box.appendChild(inp);
    modal({ title, body: box, buttons: [
      { label:'取消', value:null, kind:'ghost' },
      { label:okLabel, value:true, kind:'primary' }
    ]}).then(v => res(v ? inp.value.trim() : null));
    setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}

/* ═══════════════════════════════════════════════════════════
   6. 窗口管理器
   ═══════════════════════════════════════════════════════════ */
const WM = {
  wins: new Map(),
  z: 100,
  focused: null,
  seq: 0,

  create(opts){
    const id = 'win-' + uid();
    const win = el('div', 'win');
    win.dataset.id = id;
    const titlebar = el('div', 'titlebar');
    titlebar.innerHTML = `
      <div class="tico">${opts.icon || ICONS.file}</div>
      <div class="ttl">${opts.title || '窗口'}${opts.sub ? ` <span class="tsub">${opts.sub}</span>` : ''}</div>
      <div class="tbtns">
        <button class="tbtn min" title="最小化">${SVG('<path d="M4 12h16"/>')}</button>
        <button class="tbtn max" title="最大化">${SVG('<rect x="5" y="5" width="14" height="14"/>')}</button>
        <button class="tbtn close" title="关闭">${SVG('<path d="M5 5l14 14M19 5L5 19"/>')}</button>
      </div>`;
    const body = el('div', 'win-body');
    win.appendChild(titlebar);
    win.appendChild(body);
    for(const d of ['n','s','w','e','nw','ne','sw','se']) win.appendChild(el('div', 'rs ' + d));

    // 窗口挂载在 #desktop 内，坐标必须相对 #desktop，而不是 viewport
    const dRect = $('#desktop').getBoundingClientRect();
    const availW = Math.max(240, dRect.width), availH = Math.max(180, dRect.height);
    const w = Math.min(opts.w || 760, availW - 16);
    const h = Math.min(opts.h || 520, availH - 16);
    const x = opts.x != null ? opts.x
      : clamp((availW - w) / 2 + (this.seq % 6) * 26 - 46, 6, Math.max(6, availW - w - 6));
    const y = opts.y != null ? opts.y
      : clamp((availH - h) / 2 + (this.seq % 6) * 22 - 34, 6, Math.max(6, availH - h - 6));
    this.seq++;
    Object.assign(win.style, { left:x+'px', top:y+'px', width:w+'px', height:h+'px' });

    $('#desktop').appendChild(win);

    const rec = {
      id, el:win, body, title:opts.title, appId:opts.appId || opts.title,
      minimized:false, maximized:false, snap:null,
      prevRect:null, onClose:opts.onClose, app:opts.app || null, icon:opts.icon
    };
    this.wins.set(id, rec);

    // 焦点置顶
    win.addEventListener('pointerdown', () => this.focus(id), true);

    // 拖拽（Pointer Events，Windows 为主；触摸同样可用）
    let drag = null;
    titlebar.addEventListener('pointerdown', e => {
      if(e.target.closest('.tbtn') || e.target.closest('button')) return;
      if(rec.maximized) return;
      drag = { sx:e.clientX, sy:e.clientY, ox:parseFloat(win.style.left), oy:parseFloat(win.style.top), moved:false };
      titlebar.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    titlebar.addEventListener('pointermove', e => {
      if(!drag) return;
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if(Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      win.style.left = (drag.ox + dx) + 'px';
      win.style.top  = Math.max(0, drag.oy + dy) + 'px';
      // Aero Snap 预览
      const zone = this.snapZone(e.clientX, e.clientY);
      this.showSnapPreview(zone);
    });
    const endDrag = e => {
      if(!drag) return;
      const zone = this.snapZone(e.clientX, e.clientY);
      this.showSnapPreview(null);
      if(zone && drag.moved) this.applySnap(id, zone);
      drag = null;
    };
    titlebar.addEventListener('pointerup', endDrag);
    titlebar.addEventListener('pointercancel', () => { drag = null; this.showSnapPreview(null); });
    titlebar.addEventListener('dblclick', e => {
      if(e.target.closest('.tbtn')) return;
      this.toggleMax(id);
    });

    // 八向缩放
    win.querySelectorAll('.rs').forEach(h => {
      h.addEventListener('pointerdown', e => {
        if(rec.maximized) return;
        e.stopPropagation();
        const dir = h.className.replace('rs ','');
        const r = { sx:e.clientX, sy:e.clientY, l:parseFloat(win.style.left), t:parseFloat(win.style.top), w:win.offsetWidth, h:win.offsetHeight };
        const mm = ev => {
          const dx = ev.clientX - r.sx, dy = ev.clientY - r.sy;
          let { l, t, w:ww, h:hh } = r;
          if(dir.includes('e')) ww = r.w + dx;
          if(dir.includes('s')) hh = r.h + dy;
          if(dir.includes('w')){ ww = r.w - dx; l = r.l + dx; }
          if(dir.includes('n')){ hh = r.h - dy; t = r.t + dy; }
          if(ww < 220){ if(dir.includes('w')) l = r.l + r.w - 220; ww = 220; }
          if(hh < 140){ if(dir.includes('n')) t = r.t + r.h - 140; hh = 140; }
          Object.assign(win.style, { left:l+'px', top:Math.max(0,t)+'px', width:ww+'px', height:hh+'px' });
        };
        const mu = () => {
          document.removeEventListener('pointermove', mm);
          document.removeEventListener('pointerup', mu);
        };
        document.addEventListener('pointermove', mm);
        document.addEventListener('pointerup', mu);
        e.preventDefault();
      });
    });

    titlebar.querySelector('.tbtn.close').onclick = e => { e.stopPropagation(); this.close(id); };
    titlebar.querySelector('.tbtn.min').onclick  = e => { e.stopPropagation(); this.minimize(id); };
    titlebar.querySelector('.tbtn.max').onclick   = e => { e.stopPropagation(); this.toggleMax(id); };

    this.focus(id);
    renderRailApps();
    return rec;
  },

  focus(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    if(this.focused === id && rec.el.classList.contains('focused')) return;
    for(const [wid, w] of this.wins){ w.el.classList.remove('focused'); }
    rec.el.style.zIndex = ++this.z;
    rec.el.classList.add('focused');
    rec.el.classList.remove('minimized');
    rec.minimized = false;
    this.focused = id;
    renderRailApps();
    if(rec.onFocus) rec.onFocus();
  },

  close(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    rec.el.classList.add('closing');
    setTimeout(() => {
      rec.el.remove();
      this.wins.delete(id);
      if(this.focused === id){
        this.focused = null;
        const rest = Array.from(this.wins.values()).filter(w => !w.minimized);
        if(rest.length) this.focus(rest[rest.length - 1].id);
      }
      renderRailApps();
      if(rec.onClose) rec.onClose();
    }, 130);
  },

  minimize(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    rec.minimized = true;
    rec.el.classList.add('minimized');
    if(this.focused === id) this.focused = null;
    renderRailApps();
    const rest = Array.from(this.wins.values()).filter(w => !w.minimized);
    if(rest.length) this.focus(rest[rest.length - 1].id);
  },

  restore(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    rec.minimized = false;
    rec.el.classList.remove('minimized');
    this.focus(id);
  },

  toggleMax(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    if(rec.maximized){
      const r = rec.prevRect;
      Object.assign(rec.el.style, { left:r.left, top:r.top, width:r.width, height:r.height });
      rec.el.classList.remove('maximized');
      rec.maximized = false;
    }else{
      rec.prevRect = {
        left:rec.el.style.left, top:rec.el.style.top,
        width:rec.el.style.width, height:rec.el.style.height
      };
      this.maximizeTo(id);
    }
    renderRailApps();
  },

  maximizeTo(id){
    const rec = this.wins.get(id);
    if(!rec) return;
    const d = $('#desktop').getBoundingClientRect();
    Object.assign(rec.el.style, {
      left:'0px', top:'0px',
      width:d.width + 'px', height:d.height + 'px'
    });
    rec.el.classList.add('maximized');
    rec.maximized = true;
    rec.snap = 'max';
    if(rec.onResize) rec.onResize();
  },

  snapZone(cx, cy){
    const d = $('#desktop').getBoundingClientRect();
    if(cy <= d.top + 8) return 'max';
    if(cx <= d.left + 14) return 'left';
    if(cx >= d.right - 14) return 'right';
    return null;
  },

  showSnapPreview(zone){
    const p = $('#snapPreview');
    if(!zone){ p.classList.remove('on'); return; }
    const d = $('#desktop').getBoundingClientRect();
    let r;
    if(zone === 'max') r = { l:d.left, t:d.top, w:d.width, h:d.height };
    else if(zone === 'left') r = { l:d.left, t:d.top, w:d.width/2, h:d.height };
    else r = { l:d.left + d.width/2, t:d.top, w:d.width/2, h:d.height };
    Object.assign(p.style, { left:r.l+'px', top:r.t+'px', width:r.w+'px', height:r.h+'px' });
    p.classList.add('on');
  },

  applySnap(id, zone){
    const rec = this.wins.get(id);
    if(!rec) return;
    if(zone === 'max'){ if(!rec.prevRect) rec.prevRect = { left:rec.el.style.left, top:rec.el.style.top, width:rec.el.style.width, height:rec.el.style.height }; this.maximizeTo(id); return; }
    if(rec.maximized){
      rec.maximized = false;
      rec.el.classList.remove('maximized');
    }
    if(!rec.prevRect) rec.prevRect = { left:rec.el.style.left, top:rec.el.style.top, width:rec.el.style.width, height:rec.el.style.height };
    const d = $('#desktop').getBoundingClientRect();
    rec.el.style.top = '0px';
    rec.el.style.height = d.height + 'px';
    rec.el.style.width = (d.width / 2) + 'px';
    rec.el.style.left = (zone === 'left' ? 0 : d.width / 2) + 'px';
    rec.snap = zone;
    if(rec.onResize) rec.onResize();
  },

  setTitle(id, title, sub){
    const rec = this.wins.get(id);
    if(!rec) return;
    rec.el.querySelector('.ttl').innerHTML = title + (sub ? ` <span class="tsub">${sub}</span>` : '');
    rec.title = title;
    renderRailApps();
  },
  byApp(appId){ return Array.from(this.wins.values()).filter(w => w.appId === appId); }
};

/* Aero Peek */
function setPeek(on, targetId){
  on = !!on;
  document.body.classList.toggle('peek', on);
  for(const w of WM.wins.values()) w.el.classList.toggle('peek-target', on && w.id === targetId);
}

/* ═══════════════════════════════════════════════════════════
   7. 任务栏 / 时钟
   ═══════════════════════════════════════════════════════════ */
function renderRailApps(){
  const wrap = $('#railApps');
  // 重建按钮时浏览器不会派发 mouseleave，Aero Peek 会永久卡在幽灵态 —— 必须强制复位
  setPeek(false);
  const cur = wrap.scrollTop;
  wrap.innerHTML = '';
  for(const w of WM.wins.values()){
    const b = el('button', 'rail-btn running' + (WM.focused === w.id && !w.minimized ? ' focused' : ''));
    b.title = w.title;
    b.innerHTML = `<span class="lamp"></span>${w.icon || ICONS.file}<span class="rclose" title="关闭窗口">${ICONS.x}</span>`;
    b.querySelector('.rclose').onclick = e => { e.stopPropagation(); WM.close(w.id); };
    b.onclick = () => {
      if(w.minimized) WM.restore(w.id);
      else if(WM.focused === w.id) WM.minimize(w.id);
      else WM.focus(w.id);
    };
    // 悬停 220ms 才进入 Aero Peek，光标扫过不会闪；离开立即恢复
    b.addEventListener('mouseenter', () => {
      clearTimeout(b._peekT);
      b._peekT = setTimeout(() => setPeek(true, w.id), 220);
    });
    b.addEventListener('mouseleave', () => { clearTimeout(b._peekT); setPeek(false); });
    const winMenu = () => [
      { label:'还原 / 最大化', icon:ICONS.full, fn:() => WM.toggleMax(w.id) },
      { label:'最小化', icon:ICONS.chevD, fn:() => WM.minimize(w.id) },
      { sep:true },
      { label:'关闭窗口', icon:ICONS.x, fn:() => WM.close(w.id) }
    ];
    b.oncontextmenu = e => { e.preventDefault(); showContext(e.clientX, e.clientY, winMenu()); };
    bindLongPress(b, pos => showContext(pos.clientX, pos.clientY, winMenu()), '.rclose');
    wrap.appendChild(b);
  }
  wrap.scrollTop = cur;
}

function tickClock(){
  const now = Date.now();
  const c = fmtClock(now, Settings.data.clock12);
  let t = c.t;
  if(Settings.data.clockShowSec) t += ':' + String(new Date(now).getSeconds()).padStart(2, '0');
  $('#clkTime').textContent = t;
  $('#clkAp').textContent = c.ap;
  const d = new Date(now);
  $('#clkDate').textContent = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
setInterval(tickClock, 1000);

/* 日历弹窗 */
let calDate = new Date();
function openCalendar(){
  const existing = $('#calPop');
  if(existing){ existing.remove(); return; }
  const pop = el('div');
  pop.id = 'calPop';
  const railSide = document.documentElement.dataset.rail || 'left';
  const calPos = {
    position:'fixed', width:'288px', zIndex:'9600',
    background:'linear-gradient(180deg,var(--steel-750),var(--steel-850))',
    border:'1px solid var(--steel-500)', boxShadow:'0 28px 66px -16px rgba(0,0,0,.85)', padding:'13px'
  };
  if(railSide === 'left'){ calPos.left = 'calc(var(--rail-w) + 10px)'; calPos.bottom = '12px'; }
  else if(railSide === 'right'){ calPos.right = 'calc(var(--rail-w) + 10px)'; calPos.bottom = '12px'; }
  else if(railSide === 'bottom'){ calPos.left = '12px'; calPos.bottom = 'calc(var(--rail-h) + 10px)'; }
  else { calPos.left = '12px'; calPos.top = 'calc(var(--rail-h) + 10px)'; }
  Object.assign(pop.style, calPos);
  document.body.appendChild(pop);
  const render = () => {
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const first = new Date(y, m, 1);
    const startDow = (first.getDay() + 6) % 7;
    const days = new Date(y, m + 1, 0).getDate();
    const today = new Date();
    let cells = '';
    for(let i = 0; i < startDow; i++) cells += '<div></div>';
    for(let d = 1; d <= days; d++){
      const isT = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
      cells += `<div style="text-align:center;padding:6px 0;font-family:var(--font-mono);font-size:11px;cursor:pointer;border-radius:2px;${isT ? 'background:var(--amber);color:#1a1206;font-weight:700;' : 'color:var(--ink);'}">${d}</div>`;
    }
    pop.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:11px">
        <button class="icon-btn" data-nav="-1">${ICONS.back}</button>
        <div class="mono" style="font-size:13px;color:var(--amber);letter-spacing:.12em">${y} / ${String(m+1).padStart(2,'0')}</div>
        <button class="icon-btn" data-nav="1">${ICONS.forward}</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px">
        ${['一','二','三','四','五','六','日'].map(d => `<div class="stencil" style="justify-content:center;font-size:9px;letter-spacing:.1em">${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div>
      <div class="stencil" style="margin-top:11px">${fmtDate(Date.now(), true)}</div>`;
    pop.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
      calDate.setMonth(calDate.getMonth() + Number(b.dataset.nav));
      render();
    });
  };
  render();
  setTimeout(() => {
    const off = e => { if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('pointerdown', off); } };
    document.addEventListener('pointerdown', off);
  }, 30);
}

   8. 右键菜单
   ═══════════════════════════════════════════════════════════ */
function showContext(x, y, items){
  const m = $('#ctxMenu');
  m.innerHTML = '';
  for(const it of items){
    if(it.sep){ m.appendChild(el('div','ci sep')); continue; }
    const row = el('div', 'ci' + (it.disabled ? ' dis' : ''));
    row.innerHTML = `<span class="ci-ic">${it.icon || ICONS.chevR}</span><span>${it.label}</span>${it.key ? `<span class="k">${it.key}</span>` : ''}`;
    if(it.fn) row.onclick = () => { hideContext(); it.fn(); };
    m.appendChild(row);
  }
  m.classList.add('open');
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top  = Math.min(y, innerHeight - r.height - 8) + 'px';
}
function hideContext(){ $('#ctxMenu').classList.remove('open'); }
document.addEventListener('pointerdown', e => {
  if(typeof isSwallowing === 'function' && isSwallowing()) return;  // 长按后吞掉合成事件，避免菜单被立刻关闭
  if(!e.target.closest('#ctxMenu')) hideContext();
  if(!e.target.closest('#startMenu') && !e.target.closest('#btnStart')) closeStart();
}, true);
document.addEventListener('contextmenu', e => {
  if(e.target.closest('#ctxMenu')) return;
  if(!e.target.closest('#desktop') && !e.target.closest('.file-view') && !e.target.closest('.grid-view') && !e.target.closest('.miller')) return;
  e.preventDefault();
});

/* ═══════════════════════════════════════════════════════════
   10. 桌面图标

const Desktop = {
  icons: new Map(),
  layer: $('#deskLayer'),
  cell: 12,
  colW: 100,
  rowH: 96,

  async refresh(){
    this.layer.innerHTML = '';
    this.icons.clear();
    let items = [];
    try{ items = await fs.readdir('/桌面'); }catch(e){ items = []; }
    items.sort((a,b) => (b.isDir - a.isDir) || naturalCompare(a.name, b.name));
    const pos = Settings.data.deskIconPos || {};
    const W = this.layer.clientWidth, H = this.layer.clientHeight;
    const cols = Math.max(1, Math.floor((W - 100) / this.colW) || 1);
    items.forEach((it, i) => {
      let p = pos[it.path];
      if(!p){
        const c = Math.floor(i / Math.max(1, Math.floor((H - 40) / this.rowH) || 1));
        const r = i % Math.max(1, Math.floor((H - 40) / this.rowH) || 1);
        p = { x: 18 + c * this.colW, y: 18 + r * this.rowH };
      }
      const node = this.makeIcon(it, p.x, p.y, i);
      this.layer.appendChild(node);
      this.icons.set(it.path, { node, item:it });
    });
  },

  makeIcon(it, x, y, idx){
    const n = el('div', 'dicon');
    n.dataset.path = it.path;
    n.style.left = x + 'px';
    n.style.top = y + 'px';
    if(!reducedMotion) n.style.animationDelay = Math.min(idx * 24, 600) + 'ms';
    n.innerHTML = `
      <div class="ic">${iconFor(it.name, it.isDir)}</div>
      <div class="lbl">${it.name}</div>
      ${it.backend && it.backend !== 'meta' ? `<div class="badge">${it.backend === 'opfs' ? 'OPFS' : it.backend === 'idb' ? 'IDB' : 'LOCAL'}</div>` : ''}`;
    n.draggable = !IS_TOUCH;

    n.addEventListener('click', e => {
      e.stopPropagation();
      if(!e.ctrlKey && !e.metaKey && !e.shiftKey) this.clearSelection();
      n.classList.add('selected');
    });
    n.addEventListener('dblclick', e => { e.stopPropagation(); openPath(it.path); });
    // 触屏：单击即打开
    if(IS_TOUCH){
      n.addEventListener('click', e => { e.stopPropagation(); openPath(it.path); });
    }
    n.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if(!n.classList.contains('selected')){ this.clearSelection(); n.classList.add('selected'); }
      showContext(e.clientX, e.clientY, this.itemMenu(it));
    });
    // 触屏长按 → 右键菜单
    bindLongPress(n, pos => {
      if(!n.classList.contains('selected')){ this.clearSelection(); n.classList.add('selected'); }
      showContext(pos.clientX, pos.clientY, this.itemMenu(it));
    });

    // HTML5 原生拖拽（指针设备）
    if(!IS_TOUCH){
      n.addEventListener('dragstart', e => {
        n.classList.add('dragging');
        e.dataTransfer.setData('text/plain', it.path);
        e.dataTransfer.setData('application/x-rivet-path', it.path);
        e.dataTransfer.effectAllowed = 'copyMove';
        // 预加载内容以支持拖出浏览器
        DragOut.prepare(it).then(p => {
          if(p) e.dataTransfer.setData('DownloadURL', p);
        });
      });
      n.addEventListener('dragend', () => n.classList.remove('dragging'));
    }else{
      // 触摸设备自定义拖拽
      attachTouchDrag(n, (dx, dy) => {
        const nx = clamp(parseFloat(n.style.left) + dx, 0, this.layer.clientWidth - 90);
        const ny = clamp(parseFloat(n.style.top) + dy, 0, this.layer.clientHeight - 90);
        n.style.left = nx + 'px'; n.style.top = ny + 'px';
      }, () => this.savePos(it.path, n));
    }
    return n;
  },

  clearSelection(){ this.layer.querySelectorAll('.dicon.selected').forEach(x => x.classList.remove('selected')); },
  savePos(path, node){
    const pos = Settings.data.deskIconPos || (Settings.data.deskIconPos = {});
    pos[path] = {
      x: Math.round(parseFloat(node.style.left) / this.cell) * this.cell,
      y: Math.round(parseFloat(node.style.top) / this.cell) * this.cell
    };
    node.style.left = pos[path].x + 'px';
    node.style.top = pos[path].y + 'px';
    Settings.save();
  },
  arrange(){
    Settings.data.deskIconPos = {};
    Settings.save();
    this.refresh();
  },

  itemMenu(it){
    return [
      { label:'打开', icon:ICONS.folderOpen, key:'单击', fn:() => openPath(it.path) },
      ...(KIND.code(it.name) && /\.(html?|svg)$/i.test(it.name) ? [
        { label:'编辑源代码', icon:ICONS.code, fn:() => openWith(it.path, 'code') }
      ] : []),
      { sep:true },
      { label:'重命名', icon:ICONS.rename, key:'F2', fn:() => this.renameItem(it) },
      { label:'复制', icon:ICONS.copy, fn:() => { Clipboard.copy([it.path]); toast('已复制到剪贴板'); } },
      { label:'下载到本地', icon:ICONS.download, fn:() => exportPaths([it.path]) },
      { sep:true },
      { label:'删除', icon:ICONS.trash, key:'Del', fn:() => deletePaths([it.path]) },
      { label:'属性', icon:ICONS.info, fn:() => showProperties(it) }
    ];
  },

  async renameItem(it){
    const name = await promptModal('重命名', '新的名称', it.name);
    if(!name || name === it.name) return;
    try{
      await fs.rename(it.path, fs.parentOf(it.path) + '/' + name);
      await Desktop.refresh();
      toast('已重命名', 'ok');
    }catch(e){ toast(e.message, 'err'); }
  }
};

/* ═══════════════════════════════════════════════════════════
   通用框选（Marquee）— 严格遵循框选架构标准
   1. MouseEvent + TouchEvent 通用 getClientXY 抹平触点
   2. 选框 pointer-events:none；容器 position:relative；坐标严格累加 scrollLeft/scrollTop
   3. e.target.closest(itemSelector) 判定，仅在容器空白处启动
   4. handleMove / handleEnd 注册在 document；touchmove { passive:false } preventDefault 锁死原生滚动
   5. 40px 感应带边缘自动滚动 + AABB 对 offsetLeft/Top 碰撞判定
   6. destroy() 完整清理
   ═══════════════════════════════════════════════════════════ */
function getClientXY(e){
  if(e.touches && e.touches.length) return { x:e.touches[0].clientX, y:e.touches[0].clientY };
  if(e.changedTouches && e.changedTouches.length) return { x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY };
  return { x:e.clientX, y:e.clientY };
}

function createMarquee(container, itemSelector, opts = {}){
  if(!container) return { destroy(){} };
  if(container._marqueeInstance) container._marqueeInstance.destroy();

  const EDGE = 40;
  let box = null, startX = 0, startY = 0, lastX = 0, lastY = 0;
  let active = false, raf = 0, items = [];
  const prevTouchAction = container.style.touchAction;

  function collect(){
    items = Array.from(container.querySelectorAll(itemSelector)).map(n => ({
      n, l:n.offsetLeft, t:n.offsetTop, w:n.offsetWidth, h:n.offsetHeight
    }));
  }
  function paint(){
    const r = container.getBoundingClientRect();
    const cx = lastX - r.left + container.scrollLeft;
    const cy = lastY - r.top + container.scrollTop;
    const l = Math.min(startX, cx), t = Math.min(startY, cy);
    const w = Math.abs(cx - startX), h = Math.abs(cy - startY);
    box.style.left = l + 'px'; box.style.top = t + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    for(const b of items){
      const hit = !(b.l > l + w || b.l + b.w < l || b.t > t + h || b.t + b.h < t);
      if(b.n.classList.contains('selected') !== hit) b.n.classList.toggle('selected', hit);
    }
    if(opts.onChange) opts.onChange(items, { l, t, w, h });
  }
  function edgeLoop(){
    if(!active){ raf = 0; return; }
    const r = container.getBoundingClientRect();
    let dx = 0, dy = 0;
    if(lastY < r.top + EDGE) dy = -(Math.min(EDGE, r.top + EDGE - lastY) / 2.2);
    else if(lastY > r.bottom - EDGE) dy = Math.min(EDGE, lastY - (r.bottom - EDGE)) / 2.2;
    if(lastX < r.left + EDGE) dx = -(Math.min(EDGE, r.left + EDGE - lastX) / 2.2);
    else if(lastX > r.right - EDGE) dx = Math.min(EDGE, lastX - (r.right - EDGE)) / 2.2;
    if(dx || dy){
      container.scrollLeft += dx;
      container.scrollTop += dy;
      paint();
    }
    raf = requestAnimationFrame(edgeLoop);
  }
  function handleMove(e){
    if(!active) return;
    if(e.cancelable) e.preventDefault();
    const p = getClientXY(e);
    lastX = p.x; lastY = p.y;
    paint();
    if(!raf) raf = requestAnimationFrame(edgeLoop);
  }
  function handleEnd(){
    if(!active) return;
    active = false;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    if(box){ box.remove(); box = null; }
    detach();
    container.style.touchAction = prevTouchAction;
    document.body.classList.remove('marquee-host-selecting');
    if(opts.onEnd) opts.onEnd();
  }
  function handleStart(e){
    if(active) return;
    if(e.target.closest(itemSelector)) return;
    if(e.target.closest('button, input, select, textarea, a, .th, .grip, .crumb, .side-item, .mitem')) return;
    if(e.type === 'mousedown' && e.button !== 0) return;
    if(e.type === 'touchstart' && e.touches.length !== 1) return;
    e.preventDefault();                       // 阻断原生滚动 / 文本选择 / 触摸滚动手势
    const p = getClientXY(e);
    const r = container.getBoundingClientRect();
    startX = p.x - r.left + container.scrollLeft;
    startY = p.y - r.top + container.scrollTop;
    lastX = p.x; lastY = p.y;
    collect();
    box = el('div', 'marquee');
    Object.assign(box.style, { left:startX + 'px', top:startY + 'px', width:'0px', height:'0px' });
    container.appendChild(box);
    active = true;
    container.style.touchAction = 'none';
    document.body.classList.add('marquee-host-selecting');
    attach();
    if(opts.onStart) opts.onStart();
  }
  function attach(){
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', handleEnd);
    document.addEventListener('touchmove', handleMove, { passive:false });
    document.addEventListener('touchend', handleEnd);
    document.addEventListener('touchcancel', handleEnd);
  }
  function detach(){
    document.removeEventListener('mousemove', handleMove);
    document.removeEventListener('mouseup', handleEnd);
    document.removeEventListener('touchmove', handleMove);
    document.removeEventListener('touchend', handleEnd);
    document.removeEventListener('touchcancel', handleEnd);
  }
  container.addEventListener('mousedown', handleStart);
  container.addEventListener('touchstart', handleStart, { passive:false });

  const api = {
    destroy(){
      if(raf) cancelAnimationFrame(raf);
      detach();
      container.removeEventListener('mousedown', handleStart);
      container.removeEventListener('touchstart', handleStart);
      if(box) box.remove();
      container.style.touchAction = prevTouchAction;
      delete container._marqueeInstance;
    }
  };
  container._marqueeInstance = api;
  return api;
}

/* 触摸拖拽辅助（仅在粗指针设备启用） */
function attachTouchDrag(node, onMove, onEnd){
  let st = null;
  node.style.touchAction = 'none';      // 否则 pointer/touch 会被原生滚动手势 pointercancel
  node.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    st = { x:e.touches[0].clientX, y:e.touches[0].clientY, lx:e.touches[0].clientX, ly:e.touches[0].clientY, moved:false };
  }, { passive:true });
  node.addEventListener('touchmove', e => {
    if(!st) return;
    const t = e.touches[0];
    const total = Math.abs(t.clientX - st.x) + Math.abs(t.clientY - st.y);
    if(total > 8) st.moved = true;
    if(st.moved){
      e.preventDefault();
      onMove(t.clientX - st.lx, t.clientY - st.ly);
      st.lx = t.clientX; st.ly = t.clientY;
    }
  }, { passive:false });
  node.addEventListener('touchend', () => {
    if(st && st.moved && onEnd) onEnd();
    st = null;
  });
}

/* ═══════════════════════════════════════════════════════════
   触屏长按右键菜单 — 任何位置一致触发
   · 420ms 触发，位移容差 12px（轻微手抖不会取消）
   · 触发后吞掉浏览器合成的 mousedown / mouseup / click，
     避免菜单刚打开就被合成 pointerdown 关闭
   ═══════════════════════════════════════════════════════════ */
let _swallowUntil = 0;
const _swallowTypes = ['mousedown', 'mouseup', 'click', 'pointerdown'];
function _removeSwallow(stop){ _swallowTypes.forEach(t => document.removeEventListener(t, stop, true)); }
function swallowSynthetic(){
  _swallowUntil = Date.now() + 550;
  const stop = e => {
    if(e.type === 'pointerdown' && e.pointerType !== 'mouse') return;  // 真实触控不受影响
    e.stopPropagation();
    e.preventDefault();
  };
  _swallowTypes.forEach(t => document.addEventListener(t, stop, true));
  setTimeout(() => _removeSwallow(stop), 550);
}
function isSwallowing(){ return Date.now() < _swallowUntil; }

function bindLongPress(node, handler, ignoreSelector){
  let timer = null, sx = 0, sy = 0;
  const clear = () => { if(timer){ clearTimeout(timer); timer = null; } };
  node.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    if(ignoreSelector && e.target.closest(ignoreSelector)){ clear(); return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    clear();
    timer = setTimeout(() => {
      timer = null;
      swallowSynthetic();
      try{ navigator.vibrate && navigator.vibrate(12); }catch(_){}
      handler({ clientX:sx, clientY:sy, target:e.target });
    }, 420);
  }, { passive:true });
  node.addEventListener('touchmove', e => {
    if(!timer) return;
    const t = e.touches[0];
    if(Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12) clear();
  }, { passive:true });
  node.addEventListener('touchend', clear);
  node.addEventListener('touchcancel', clear);
}

/* 桌面拖放（外部文件导入 + 内部移动） */
const DragOut = {
  cache: new Map(),
  async prepare(it){
    try{
      if(it.isDir) return null;
      const bytes = await fs.readFile(it.path);
      const blob = new Blob([bytes], { type: it.mime || mimeOf(it.name, false) });
      const url = URL.createObjectURL(blob);
      this.cache.set(it.path, url);
      setTimeout(() => { URL.revokeObjectURL(url); this.cache.delete(it.path); }, 8000);
      return `${it.mime || mimeOf(it.name, false)}:${it.name}:${url}`;
    }catch(e){ return null; }
  }
};

function bindDropTarget(node, onFiles, onInternal){
  if(!node) return;
  node.addEventListener('dragover', e => {
    if(!e.dataTransfer) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    node.classList.add('drop-active');
  });
  node.addEventListener('dragleave', e => {
    if(!node.contains(e.relatedTarget)) node.classList.remove('drop-active');
  });
  node.addEventListener('drop', async e => {
    e.preventDefault();
    node.classList.remove('drop-active');
    const items = e.dataTransfer.items;
    if(items && items.length && items[0].webkitGetAsEntry){
      const entries = [];
      for(let i = 0; i < items.length; i++){
        const en = items[i].webkitGetAsEntry();
        if(en) entries.push(en);
      }
      if(entries.length){ onFiles && await onFiles(entries, e); return; }
    }
    const files = e.dataTransfer.files;
    if(files && files.length){ onFiles && await onFiles(null, e, Array.from(files)); return; }
    const internal = e.dataTransfer.getData('application/x-rivet-path');
    if(internal && onInternal) onInternal(internal, e);
  });
}

async function importEntries(entries, destDir, progress){
  const out = [];
  const readEntry = async (entry, base) => {
    if(entry.isFile){
      const file = await new Promise((res, rej) => entry.file(res, rej));
      const bytes = new Uint8Array(await file.arrayBuffer());
      await fs.writeFile(base + '/' + file.name, bytes, { mtime: file.lastModified || Date.now() });
      out.push(base + '/' + file.name);
      progress && progress(out.length);
    }else if(entry.isDirectory){
      const dirPath = base + '/' + entry.name;
      if(!(await fs.exists(dirPath))) await fs.mkdir(dirPath);
      let reader = entry.createReader();
      let batch;
      do{
        batch = await new Promise(res => reader.readEntries(res, () => res([])));
        for(const e2 of batch) await readEntry(e2, dirPath);
      }while(batch.length > 0);
    }
  };
  for(const en of entries) await readEntry(en, destDir);
  return out;
}
async function importFiles(files, destDir, progress){
  const out = [];
  for(const f of files){
    const bytes = new Uint8Array(await f.arrayBuffer());
    await fs.writeFile(destDir + '/' + f.name, bytes, { mtime: f.lastModified || Date.now() });
    out.push(destDir + '/' + f.name);
    progress && progress(out.length);
  }
  return out;
}

const Clipboard = {
  items: [], mode: 'copy',
  copy(paths){ this.items = paths.slice(); this.mode = 'copy'; },
  cut(paths){ this.items = paths.slice(); this.mode = 'cut'; },
  clear(){ this.items = []; },
  async paste(destDir){
    if(!this.items.length) return [];
    const out = [];
    for(const p of this.items){
      const st = await fs.stat(p).catch(() => null);
      if(!st) continue;
      let target = destDir + '/' + st.name;
      let i = 2;
      while(await fs.exists(target)){
        target = destDir + '/' + baseOf(st.name) + ' (' + (i++) + ')' + (extOf(st.name) ? '.' + extOf(st.name) : '');
      }
      await fs.copy(p, target);
      out.push(target);
    }
    if(this.mode === 'cut'){
      for(const p of this.items) await fs.rm(p).catch(() => {});
      this.clear();
    }
    return out;
  }
};

async function openPath(path, forceApp){
  const st = await fs.stat(path).catch(() => null);
  if(!st){ toast('路径不存在', 'err'); return; }
  if(st.isDir){
    // 目录 → 在文件资源管理器中打开（虚拟 / 本地挂载路径统一处理）
    openApp('explorer', { path });
    return;
  }
  if(forceApp) return openApp(forceApp, { path });
  const n = st.name;
  if(KIND.image(n)) return openApp('viewer', { path });
  if(KIND.audio(n) || KIND.video(n)) return openApp('player', { path });
  if(KIND.pdf(n)) return openApp('pdf', { path });
  if(KIND.zip(n)) return openApp('archive', { path });
  if(/^(csv|tsv)$/i.test(extOf(n))) return openApp('notepad', { path });
  if(KIND.code(n)) return /\.(html?|svg)$/i.test(n) ? openApp('browser', { path }) : openApp('code', { path });
  return openApp('notepad', { path });
}

  const viewEl = root.querySelector('.file-view');
  const statusEl = root.querySelector('.exp-status');
  const crumbEl = root.querySelector('.crumbs');
  viewEl.style.position = 'relative';

  /* ── 左侧导航树 ── */
  async function renderSide(){
    sideEl.innerHTML = '';
    const h1 = el('div', 'side-h'); h1.innerHTML = '<div class="stencil">快速访问</div>'; sideEl.appendChild(h1);
    const quick = [
      ['/桌面','桌面', ICONS.home], ['/文档','文档', ICONS.file], ['/下载','下载', ICONS.download],
      ['/图片','图片', ICONS.image], ['/音乐','音乐', ICONS.music], ['/视频','视频', ICONS.video]
    ];
    for(const [p, n, ic] of quick){
      const it = el('div', 'side-item' + (state.path === p ? ' cur' : ''));
      it.innerHTML = `${ic}<span>${n}</span>`;
      it.onclick = () => go(p);
      sideEl.appendChild(it);
    }
    const h2 = el('div', 'side-h'); h2.innerHTML = '<div class="stencil">目录树</div>'; sideEl.appendChild(h2);
    const tree = el('div');
    sideEl.appendChild(tree);
    await renderTree('/桌面', tree, 0);
    await renderTree('/文档', tree, 0);
    await renderTree('/下载', tree, 0);
    await renderTree('/图片', tree, 0);

    const h3 = el('div', 'side-h'); h3.innerHTML = '<div class="stencil">系统 / 挂载</div>'; sideEl.appendChild(h3);
    for(const p of ['/挂载','/存储','/系统']){
      const it = el('div', 'side-item' + (state.path === p ? ' cur' : ''));
      it.innerHTML = `${p === '/挂载' ? ICONS.mount : p === '/存储' ? ICONS.database : ICONS.drive}<span>${p.slice(1)}</span>`;
      it.onclick = () => go(p);
      sideEl.appendChild(it);
    }
    for(const [name] of fs.mounts){
      const it = el('div', 'side-item');
      it.innerHTML = `${ICONS.cloud}<span>${escapeHtml(name)}</span><span class="mono" style="margin-left:auto;font-size:8px;opacity:.5">LOCAL</span>`;
      it.onclick = () => go('/挂载/' + name);
      sideEl.appendChild(it);
    }
  }
  async function renderTree(dir, container, depth){
    const wrap = el('div');
    const item = el('div', 'side-item' + (state.path === dir ? ' cur' : ''));
    item.style.paddingLeft = (8 + depth * 13) + 'px';
    const name = fs.nameOf(dir);
    const tw = el('span', 'tw', ICONS.chevR);
    item.innerHTML = `<span style="color:var(--amber);display:flex;width:14px;height:14px">${ICONS.folder}</span><span>${escapeHtml(name)}</span>`;
    item.prepend(tw);
    item.onclick = e => {
      if(e.target.closest('.tw')){
        tw.classList.toggle('open');
        wrap.querySelector('.tree-children')?.classList.toggle('hidden');
        wrap.querySelector('.tree-children') && (wrap.querySelector('.tree-children').style.display = tw.classList.contains('open') ? 'block' : 'none');
      } else go(dir);
    };
    wrap.appendChild(item);
    const kids = el('div', 'tree-children');
    kids.style.display = 'none';
    wrap.appendChild(kids);
    container.appendChild(wrap);
    let subs = [];
    try{ subs = (await fs.readdir(dir)).filter(x => x.isDir).sort((a,b) => naturalCompare(a.name, b.name)); }catch(e){}
    for(const s of subs.slice(0, 40)) await renderTree(s.path, kids, depth + 1);
  }

  /* ── 面包屑 ── */
  function renderCrumbs(){
    crumbEl.innerHTML = '';
    const parts = state.path.split('/').filter(Boolean);
    const root1 = el('div', 'crumb', '计算机');
    root1.onclick = () => go('/');
    crumbEl.appendChild(root1);
    let acc = '';
    parts.forEach((p, i) => {
      acc += '/' + p;
      crumbEl.appendChild(el('span', 'crumb-sep', ICONS.chevR));
      const c = el('div', 'crumb' + (i === parts.length - 1 ? ' cur' : ''), escapeHtml(p));
      c.onclick = () => go(acc);
      crumbEl.appendChild(c);
    });
    crumbEl.scrollLeft = crumbEl.scrollWidth;
  }

  /* ── 排序 ── */
  function sortItems(items){
    const k = state.sortKey, dir = state.sortDir;
    return items.slice().sort((a, b) => {
      if(a.isDir !== b.isDir) return a.isDir ? -1 : 1;
      let r = 0;
      if(k === 'name') r = naturalCompare(a.name, b.name);
      else if(k === 'size') r = (a.size || 0) - (b.size || 0);
      else if(k === 'mtime') r = (a.mtime || 0) - (b.mtime || 0);
      else if(k === 'type') r = naturalCompare(typeLabel(a.name, a.isDir), typeLabel(b.name, b.isDir));
      return r * dir;
    });
  }

  /* ── 渲染主区 ── */
  const folderSizeCache = new Map();
  async function getDisplaySize(it){
    if(!it.isDir) return fmtSize(it.size);
    if(folderSizeCache.has(it.path)) return fmtSize(folderSizeCache.get(it.path));
    folderSizeCache.set(it.path, 0);
    fs.dirSize(it.path).then(s => {
      folderSizeCache.set(it.path, s);
      viewEl.querySelectorAll('[data-sizepath]').forEach(c => {
        if(c.dataset.sizepath === it.path) c.textContent = fmtSize(s);
      });
    });
    return '计算中…';
  }

  async function render(){
    let items = [];
    try{ items = await fs.readdir(state.path); }
    catch(e){ viewEl.innerHTML = `<div class="loader"><div class="ring"></div><div class="txt">${escapeHtml(e.message)}</div></div>`; return; }
    if(state.search){
      const q = state.search.toLowerCase();
      items = items.filter(i => i.name.toLowerCase().includes(q));
    }
    items = sortItems(items);
    renderCrumbs();

    if(state.view === 'miller'){ renderMiller(items); return; }
    if(state.searchGlobal && state.search){
      const el0 = viewEl;
      el0.innerHTML = `<div class="loader"><div class="ring"></div><div class="txt">全盘搜索「${escapeHtml(state.search)}」…</div></div>`;
      items = await fs.search(state.search, '/');
      el0.innerHTML = '';
    }

    viewEl.innerHTML = '';
    if(!items.length){
      viewEl.innerHTML = `<div class="loader">${ICONS.folder}<div class="txt">此目录为空</div></div>`;
      renderStatus(items);
      return;
    }

    if(state.view === 'details'){
      const tbl = el('div', 'tbl');
      const head = el('div', 'tbl-head');
      for(const c of state.cols){
        const th = el('div', 'th' + (state.sortKey === c.key ? ' sorted' : ''));
        th.style.width = c.w + 'px';
        th.innerHTML = `<span>${c.label}</span><span class="sort">${state.sortDir > 0 ? '▲' : '▼'}</span><span class="grip"></span>`;
        th.onclick = e => {
          if(e.target.closest('.grip')) return;
          if(state.sortKey === c.key) state.sortDir *= -1;
          else { state.sortKey = c.key; state.sortDir = 1; }
          render();
        };
        th.querySelector('.grip').addEventListener('pointerdown', e => {
          e.stopPropagation(); e.preventDefault();
          const sx = e.clientX, sw = c.w;
          const mm = ev => { c.w = Math.max(56, sw + ev.clientX - sx); th.style.width = c.w + 'px';
            viewEl.querySelectorAll(`[data-col="${c.key}"]`).forEach(td => td.style.width = c.w + 'px'); };
          const mu = () => { document.removeEventListener('pointermove', mm); document.removeEventListener('pointerup', mu); };
          document.addEventListener('pointermove', mm);
          document.addEventListener('pointerup', mu);
        });
        head.appendChild(th);
      }
      tbl.appendChild(head);

      const rows = el('div', 'rows');
      for(const it of items){
        const row = el('div', 'row');
        row.dataset.path = it.path;
        row.draggable = !IS_TOUCH;
        const cells = state.cols.map(c => {
          const td = el('div', 'td ' + (c.key === 'name' ? 'name' : 'meta'));
          td.dataset.col = c.key;
          td.style.width = c.w + 'px';
          if(c.key === 'name'){
            td.innerHTML = KIND.image(it.name)
              ? `<img class="thumb" alt="" data-thumb="${escapeHtml(it.path)}"><span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(it.name)}</span>`
              : `<span class="fico">${iconFor(it.name, it.isDir)}</span><span style="overflow:hidden;text-overflow:ellipsis">${escapeHtml(it.name)}</span>`;
          }
          else if(c.key === 'mtime') td.textContent = fmtDate(it.mtime);
          else if(c.key === 'type') td.textContent = typeLabel(it.name, it.isDir) + (it.backend && it.backend !== 'meta' && it.backend !== 'local' ? ` · ${it.backend.toUpperCase()}` : it.backend === 'local' ? ' · LOCAL' : '');
          else if(c.key === 'size'){
            if(it.isDir){ td.dataset.sizepath = it.path; td.textContent = '计算中…'; getDisplaySize(it).then(s => td.textContent = s); }
            else td.textContent = fmtSize(it.size);
          }
          return td;
        });
        cells.forEach(c => row.appendChild(c));
        const thumbEl = row.querySelector('[data-thumb]');
        if(thumbEl) lazyThumb(thumbEl, it.path);
        bindItem(row, it);
        rows.appendChild(row);
      }
      tbl.appendChild(rows);
      viewEl.appendChild(tbl);
    }else{
      const grid = el('div', 'grid-view');
      for(const it of items){
        const g = el('div', 'gitem');
        g.dataset.path = it.path;
        g.draggable = !IS_TOUCH;
        const useThumb = KIND.image(it.name);
        g.innerHTML = `
          <div class="ic">${useThumb ? `<img data-thumb="${escapeHtml(it.path)}" alt="">` : iconFor(it.name, it.isDir)}</div>
          <div class="n">${escapeHtml(it.name)}</div>
          <div class="s">${it.isDir ? '文件夹' : fmtSize(it.size)}</div>`;
        if(useThumb) lazyThumb(g.querySelector('img'), it.path);
        bindItem(g, it);
        grid.appendChild(g);
      }
      viewEl.appendChild(grid);
    }
    renderStatus(items);
    bindMarquee(viewEl);
  }

  function renderMiller(items){
    viewEl.innerHTML = '';
    const m = el('div', 'miller');
    const col = el('div', 'mcol');
    for(const it of items){
      const i = el('div', 'mitem');
      i.innerHTML = `${iconFor(it.name, it.isDir)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(it.name)}</span>${it.isDir ? `<span class="ar">${ICONS.chevR}</span>` : ''}`;
      i._it = it;
      i.onclick = () => {
        col.querySelectorAll('.mitem').forEach(x => x.classList.remove('selected'));
        i.classList.add('selected');
        while(m.children.length > Array.from(m.children).indexOf(col) + 1) m.removeChild(m.lastChild);
        if(it.isDir) loadMillerCol(m, it.path);
      };
      i.ondblclick = () => openPath(it.path);
      i.oncontextmenu = e => { e.preventDefault(); showContext(e.clientX, e.clientY, itemMenu(it)); };
      col.appendChild(i);
    }
    m.appendChild(col);
    viewEl.appendChild(m);
  }
  async function loadMillerCol(m, path){
    const col = el('div', 'mcol');
    col.innerHTML = `<div class="loader"><div class="ring"></div></div>`;
    m.appendChild(col);
    col.scrollIntoView({ inline:'end', block:'nearest' });
    const items = sortItems(await fs.readdir(path).catch(() => []));
    col.innerHTML = '';
    for(const it of items){
      const i = el('div', 'mitem');
      i.innerHTML = `${iconFor(it.name, it.isDir)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(it.name)}</span>${it.isDir ? `<span class="ar">${ICONS.chevR}</span>` : ''}`;
      i._it = it;
      i.onclick = () => {
        col.querySelectorAll('.mitem').forEach(x => x.classList.remove('selected'));
        i.classList.add('selected');
        while(m.children.length > Array.from(m.children).indexOf(col) + 1) m.removeChild(m.lastChild);
        if(it.isDir) loadMillerCol(m, it.path);
        else openPath(it.path);
      };
      i.oncontextmenu = e => { e.preventDefault(); showContext(e.clientX, e.clientY, itemMenu(it)); };
      col.appendChild(i);
    }
    if(!items.length) col.innerHTML = `<div class="stencil" style="padding:10px">空目录</div>`;
  }

  const thumbObserver = new IntersectionObserver(entries => {
    for(const en of entries){
      if(!en.isIntersecting) continue;
      thumbObserver.unobserve(en.target);
      const p = en.target.dataset.thumb;
      fs.readBlob(p).then(b => {
        const url = URL.createObjectURL(b);
        en.target.src = url;
        en.target.onload = () => setTimeout(() => URL.revokeObjectURL(url), 30000);
      }).catch(() => { en.target.style.background = 'var(--steel-600)'; });
    }
  }, { root:null, rootMargin:'220px' });
  function lazyThumb(img, path){ img.dataset.thumb = path; thumbObserver.observe(img); }

  function renderStatus(items){
    const selN = state.sel.size;
    statusEl.innerHTML = `
      <span>${items.length} 个项目</span>
      ${selN ? `<span class="hl">已选择 ${selN} 个</span>` : ''}
      <span>${state.view === 'details' ? '详细信息' : state.view === 'grid' ? '图标' : '分栏'}</span>
      <span class="mono" style="margin-left:auto">${escapeHtml(state.path)}</span>`;
  }

  /* ── 单项交互 ── */
  function bindItem(node, it){
    node.addEventListener('click', e => {
      e.stopPropagation();
      if(e.ctrlKey || e.metaKey){ node.classList.toggle('selected'); }
      else{
        if(!state.sel.has(it.path) || !node.classList.contains('selected')){
          viewEl.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
          node.classList.add('selected');
        }
      }
      syncSel();
    });
    node.addEventListener('dblclick', e => { e.stopPropagation(); openPath(it.path); });
    // 触屏：单击即打开（默认单击打开）
    if(IS_TOUCH) node.addEventListener('click', e => { e.stopPropagation(); openPath(it.path); });
    node.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      if(!node.classList.contains('selected')){ viewEl.querySelectorAll('.selected').forEach(x => x.classList.remove('selected')); node.classList.add('selected'); syncSel(); }
      showContext(e.clientX, e.clientY, itemMenu(it));
    });
    // 触屏长按 → 右键菜单
    bindLongPress(node, pos => {
      if(!node.classList.contains('selected')){ viewEl.querySelectorAll('.selected').forEach(x => x.classList.remove('selected')); node.classList.add('selected'); syncSel(); }
      showContext(pos.clientX, pos.clientY, itemMenu(it));
    });
    if(!IS_TOUCH){
      node.addEventListener('dragstart', e => {
        const paths = state.sel.has(it.path) && state.sel.size > 1 ? Array.from(state.sel) : [it.path];
        e.dataTransfer.setData('text/plain', paths.join('\n'));
        e.dataTransfer.setData('application/x-rivet-path', paths[0]);
        e.dataTransfer.effectAllowed = 'copyMove';
        DragOut.prepare(it).then(p => { if(p) e.dataTransfer.setData('DownloadURL', p); });
      });
      node.addEventListener('dragover', e => {
        if(!it.isDir) return;
        e.preventDefault(); e.stopPropagation();
        node.style.outline = '2px solid var(--amber)';
      });
      node.addEventListener('dragleave', () => node.style.outline = '');
      node.addEventListener('drop', async e => {
        if(!it.isDir) return;
        e.preventDefault(); e.stopPropagation();
        node.style.outline = '';
        await handleDrop(e, it.path);
      });
    }
  }
  function syncSel(){
    state.sel.clear();
    viewEl.querySelectorAll('.selected').forEach(x => x.dataset.path && state.sel.add(x.dataset.path));
    renderStatus(viewEl.querySelectorAll('.row,.gitem').length ? Array.from(viewEl.querySelectorAll('.row,.gitem')).map(x => ({ path:x.dataset.path })) : []);
  }

  /* ── 框选：委托给通用 createMarquee（含边缘自动滚动 + AABB 碰撞） ── */
  function bindMarquee(container){
    createMarquee(container, '.row, .gitem', {
      onStart(){ sideEl.classList.remove('open'); },
      onEnd(){ syncSel(); }
    });
  }

  /* ── 当前目录空白处菜单 ── */
  function folderMenu(){
    const readOnly = fs.isVirtualView(state.path);   // 存储视图 / 挂载根：只读查询结果
    return [
      { label:'新建文件夹', icon:ICONS.folder, disabled:readOnly, fn:() => root.querySelector('[data-a="newfolder"]').click() },
      { label:'新建文件', icon:ICONS.plus, disabled:readOnly, fn:() => root.querySelector('[data-a="newfile"]').click() },
      { label:'粘贴到此处', icon:ICONS.paste, key:'Ctrl+V', disabled:readOnly || !Clipboard.items.length, fn:() => pasteHere(state.path) },
      { sep:true },
      { label:'导入文件', icon:ICONS.upload, disabled:readOnly, fn:() => pickFiles(state.path) },
      { label:'挂载本地文件夹', icon:ICONS.mount, fn:() => mountLocalFolder() },
      { sep:true },
      { label:'刷新', icon:ICONS.refresh, key:'F5', fn:() => refresh() },
      { label:'全选', icon:ICONS.check, key:'Ctrl+A', fn:() => {
        viewEl.querySelectorAll('.row, .gitem').forEach(x => x.classList.add('selected'));
        syncSel();
      } },
      { sep:true },
      { label:'属性', icon:ICONS.info, fn:() => showProperties({
        path:state.path, name:fs.nameOf(state.path) || '计算机', isDir:true,
        mtime:Date.now(), backend:'meta'
      }) }
    ];
  }

  /* ── 项目右键菜单 ── */
  function itemMenu(it){
    const selPaths = state.sel.has(it.path) && state.sel.size > 1 ? Array.from(state.sel) : [it.path];
    return [
      { label:'打开', icon:ICONS.folderOpen, key:'单击', fn:() => openPath(it.path) },
      ...(KIND.code(it.name) && /\.html?$/i.test(it.name) ? [
        { label:'编辑源代码', icon:ICONS.code, fn:() => openApp('code', { path:it.path }) },
        { label:'在浏览器打开', icon:ICONS.browser, fn:() => openApp('browser', { path:it.path }) }
      ] : []),
      ...(KIND.image(it.name) ? [{ label:'漫画阅读器打开', icon:ICONS.manga, fn:() => openApp('manga', { path:it.path }) }] : []),
      { sep:true },
      { label:'剪切', icon:ICONS.cut, key:'Ctrl+X', fn:() => { Clipboard.cut(selPaths); toast('已剪切 ' + selPaths.length + ' 项'); } },
      { label:'复制', icon:ICONS.copy, key:'Ctrl+C', fn:() => { Clipboard.copy(selPaths); toast('已复制 ' + selPaths.length + ' 项'); } },
      { label:'粘贴到此处', icon:ICONS.paste, key:'Ctrl+V',
        disabled:!Clipboard.items.length || fs.isVirtualView(it.isDir ? it.path : state.path),
        fn:() => pasteHere(it.isDir ? it.path : state.path) },
      { sep:true },
      { label:'重命名', icon:ICONS.rename, key:'F2', fn:() => renameItem(it) },
      { label:'删除', icon:ICONS.trash, key:'Del', fn:() => deletePaths(selPaths).then(refresh) },
      { label:'下载到本地', icon:ICONS.download, fn:() => exportPaths(selPaths) },
      { sep:true },
      { label:'存储位置', icon:ICONS.database, disabled:it.isDir, fn:() => changeBackendMenu(it) },
      { label:'解压到此处', icon:ICONS.archive, disabled:!KIND.zip(it.name), fn:() => unzip(it.path, it.name, state.path) },
      { label:'属性', icon:ICONS.info, fn:() => showProperties(it) }
    ];
  }
  function changeBackendMenu(it){
    showContext(Math.max(20, innerWidth/2 - 110), Math.max(20, innerHeight/2 - 70), [
      { label:'移动到 OPFS', icon:ICONS.drive, fn:async () => { await fs.changeBackend(it.path, 'opfs').catch(e => toast(e.message,'err')); refresh(); toast('已迁移到 OPFS','ok'); } },
      { label:'移动到 IndexedDB', icon:ICONS.database, fn:async () => { await fs.changeBackend(it.path, 'idb').catch(e => toast(e.message,'err')); refresh(); toast('已迁移到 IndexedDB','ok'); } }
    ]);
  }
  async function pasteHere(dest){
    const out = await Clipboard.paste(dest);
    toast(`已粘贴 ${out.length} 项`, 'ok');
    refresh(); Desktop.refresh(); bus.emit('fs-change');
  }
  async function renameItem(it){
    const name = await promptModal('重命名', '新的名称', it.name);
    if(!name || name === it.name) return;
    try{
      await fs.rename(it.path, fs.parentOf(it.path) + '/' + name);
      refresh(); Desktop.refresh(); bus.emit('fs-change');
      toast('已重命名', 'ok');
    }catch(e){ toast(e.message, 'err'); }
  }

  /* ── 拖放 ── */
  async function handleDrop(e, destDir){
    const items = e.dataTransfer.items;
    if(items && items.length && items[0].webkitGetAsEntry){
      const entries = [];
      for(let i = 0; i < items.length; i++){ const en = items[i].webkitGetAsEntry(); if(en) entries.push(en); }
      if(entries.length){
        toast('正在导入…');
        const out = await importEntries(entries, destDir);
        toast(`已导入 ${out.length} 个项目`, 'ok');
        refresh(); Desktop.refresh(); bus.emit('fs-change');
        return;
      }
    }
    if(e.dataTransfer.files && e.dataTransfer.files.length){
      const out = await importFiles(Array.from(e.dataTransfer.files), destDir);
      toast(`已导入 ${out.length} 个文件`, 'ok');
      refresh(); Desktop.refresh(); bus.emit('fs-change');
      return;
    }
    const internal = e.dataTransfer.getData('application/x-rivet-path');
    if(internal){
      const paths = state.sel.size && state.sel.has(internal) ? Array.from(state.sel) : [internal];
      for(const p of paths){
        if(p === destDir || destDir.startsWith(p + '/')) continue;
        const st = await fs.stat(p).catch(() => null);
        if(!st) continue;
        let target = destDir + '/' + st.name;
        if(await fs.exists(target)){ toast('目标已存在 ' + st.name, 'err'); continue; }
        await fs.move(p, target);
      }
      refresh(); Desktop.refresh(); bus.emit('fs-change');
    }
  }
  bindDropTarget(viewEl, (entries, e, files) => handleDrop(e, state.path), (internal, e) => handleDrop(e, state.path));

  // 点击文件区任意位置 → 收起导航窗格（移动端抽屉）
  viewEl.addEventListener('pointerdown', () => sideEl.classList.remove('open'), true);

  // 触屏长按空白处 → 当前目录菜单；长按分栏项 → 项目菜单
  bindLongPress(viewEl, pos => {
    const m = pos.target.closest('.mitem');
    if(m && m._it){ showContext(pos.clientX, pos.clientY, itemMenu(m._it)); return; }
    showContext(pos.clientX, pos.clientY, folderMenu());
  }, '.row, .gitem, .th, .grip, button, input');
  root.querySelector('.exp-toolbar').addEventListener('pointerdown', e => {
    if(!e.target.closest('[data-a="side"]')) sideEl.classList.remove('open');
  }, true);

  /* ── 导航 ── */
  async function go(path, noHistory){
    path = fs.norm(path);
    if(!noHistory){
      state.history = state.history.slice(0, state.hIdx + 1);
      state.history.push(path);
      state.hIdx = state.history.length - 1;
    }
    state.path = path;
    state.sel.clear();
    state.search = '';
    root.querySelector('[data-a="search"]').value = '';
    await render();
    await renderSide();
  }
  async function refresh(){ await render(); }

  /* ── 工具栏 ── */
  root.querySelectorAll('[data-a]').forEach(b => {
    const a = b.dataset.a;
    b.onclick = async () => {
      if(a === 'back'){ if(state.hIdx > 0){ state.hIdx--; state.path = state.history[state.hIdx]; await render(); await renderSide(); } }
      else if(a === 'fwd'){ if(state.hIdx < state.history.length - 1){ state.hIdx++; state.path = state.history[state.hIdx]; await render(); await renderSide(); } }
      else if(a === 'up'){ const p = fs.parentOf(state.path); if(p !== state.path) go(p); }
      else if(a === 'refresh'){ refresh(); toast('已刷新', 'ok'); }
      else if(a === 'side'){
        if(innerWidth <= 880) sideEl.classList.toggle('open');
        else sideEl.classList.toggle('collapsed');   // 桌面端真正收起导航窗格
        root.querySelector('[data-a="side"]').classList.toggle('on', sideEl.classList.contains('open') || !sideEl.classList.contains('collapsed'));
      }
      else if(a === 'newfolder'){
        const name = await promptModal('新建文件夹', '名称', '新建文件夹');
        if(name){ await fs.mkdir(state.path + '/' + name).catch(e => toast(e.message,'err')); refresh(); Desktop.refresh(); bus.emit('fs-change'); }
      }
      else if(a === 'newfile'){
        const name = await promptModal('新建文件', '名称', '新建文本文档.txt');
        if(name){ await fs.writeFile(state.path + '/' + name, '', {}).catch(e => toast(e.message,'err')); refresh(); Desktop.refresh(); bus.emit('fs-change'); }
      }
      else if(a === 'upload'){ pickFiles(state.path); }
      else if(a === 'mount'){ mountLocalFolder(); }
      else if(a === 'gsearch'){
        state.searchGlobal = !state.searchGlobal;
        b.classList.toggle('on', state.searchGlobal);
        const si = root.querySelector('[data-a="search"]');
        si.placeholder = state.searchGlobal ? '全局搜索全部磁盘…' : '搜索当前目录…';
        si.focus();
        render();
      }
    };
    if(a === 'search'){
      b.oninput = debounce(() => { state.search = b.value.trim(); render(); }, 220);
    }
  });
  root.querySelectorAll('[data-v]').forEach(b => {
    b.onclick = () => {
      state.view = b.dataset.v;
      root.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
      render();
    };
    if(b.dataset.v === state.view) b.classList.add('on');
  });

  const win = WM.create({
    title:'文件资源管理器', icon:ICONS.folderOpen, appId:'explorer',
    w:Math.min(920, innerWidth - 60), h:Math.min(580, innerHeight - 80),
    app:{ refresh }
  });
  win.body.appendChild(root);
  go(state.path);
  return win;
}

APPS['notepad'] = {
  id:'notepad', name:'记事本', icon:ICONS.txt, cat:'办公', keywords:'文本 编辑 表格 csv',
  async launch(args = {}){
    let filePath = args.path || null;
    let dirty = false, fontSize = 13, undoStack = [], redoStack = [];
    const isSheet = filePath && /^(csv|tsv)$/i.test(extOf(filePath));
    let sheetMode = !!isSheet;

    const root = el('div', 'notepad');
    root.innerHTML = `
      <div class="np-bar">
        <button class="btn sm" data-a="save">${ICONS.save}<span>保存</span></button>
        <button class="btn sm ghost" data-a="undo">${ICONS.undo}<span>撤销</span></button>
        <button class="btn sm ghost" data-a="redo">${ICONS.redo}<span>重做</span></button>
        <div style="width:1px;height:20px;background:rgba(255,255,255,.12)"></div>
        <button class="btn sm ghost" data-a="bigger">A+</button>
        <button class="btn sm ghost" data-a="smaller">A−</button>
        ${isSheet ? `<div class="seg"><button data-s="sheet">表格视图</button><button data-s="text">文本视图</button></div>` : ''}
        <div style="flex:1"></div>
        <button class="btn sm ghost" data-a="import">${ICONS.upload}<span>导入</span></button>
        <button class="btn sm ghost" data-a="export">${ICONS.download}<span>导出</span></button>
        <button class="btn sm ghost" data-a="find">${ICONS.search}<span>查找</span></button>
      </div>
      <textarea class="np-area" spellcheck="false"></textarea>
      <div class="sheet" style="display:none"></div>
      <div class="np-status">
        <span data-s="pos">行 1, 列 1</span>
        <span data-s="cnt">0 字符</span>
        <span data-s="lines">1 行</span>
        <span style="margin-left:auto">${filePath ? escapeHtml(fs.nameOf(filePath)) : '未命名文档'}</span>
        <span class="mono" style="color:var(--phos)" data-s="saved">已就绪</span>
      </div>`;

    const ta = root.querySelector('.np-area');
    const sheetEl = root.querySelector('.sheet');
    const status = k => root.querySelector(`[data-s="${k}"]`);

    if(filePath){
      try{ ta.value = await fs.readText(filePath); }
      catch(e){ toast('读取失败: ' + e.message, 'err'); }
    }

    function parseTable(text, delim){
      const rows = [];
      let cur = [], field = '', q = false;
      for(let i = 0; i < text.length; i++){
        const c = text[i];
        if(q){
          if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else q = false; }
          else field += c;
        }else{
          if(c === '"') q = true;
          else if(c === delim){ cur.push(field); field = ''; }
          else if(c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
          else if(c !== '\r') field += c;
        }
      }
      if(field.length || cur.length){ cur.push(field); rows.push(cur); }
      return rows;
    }
    function renderSheet(){
      const text = ta.value;
      const delim = /\.tsv$/i.test(extOf(filePath || 'x.tsv')) ? '\t' : ',';
      const rows = parseTable(text, delim);
      if(!rows.length){ sheetEl.innerHTML = `<div class="loader"><div class="txt">空表格</div></div>`; return; }
      const cols = Math.max(...rows.map(r => r.length));
      let html = '<table><thead><tr><th>#</th>';
      for(let c = 0; c < cols; c++) html += `<th>${escapeHtml(rows[0][c] ?? ('列' + (c+1)))}</th>`;
      html += '</tr></thead><tbody>';
      for(let r = 1; r < rows.length; r++){
        html += `<tr><td>${r}</td>`;
        for(let c = 0; c < cols; c++) html += `<td>${escapeHtml(rows[r][c] ?? '')}</td>`;
        html += '</tr>';
      }
      html += '</tbody></table>';
      sheetEl.innerHTML = html;
    }
    function setMode(m){
      sheetMode = m === 'sheet';
      ta.style.display = sheetMode ? 'none' : 'block';
      sheetEl.style.display = sheetMode ? 'block' : 'none';
      if(sheetMode) renderSheet();
      root.querySelectorAll('[data-s]').forEach(b => { if(b.dataset.s === 'sheet' || b.dataset.s === 'text') b.classList.toggle('on', (b.dataset.s === 'sheet') === sheetMode); });
    }
    if(isSheet) setMode('sheet');

    function updateStatus(){
      const v = ta.value;
      const before = v.slice(0, ta.selectionStart);
      const line = before.split('\n').length;
      const col = before.length - before.lastIndexOf('\n');
      status('pos').textContent = `行 ${line}, 列 ${col}`;
      status('cnt').textContent = `${v.length} 字符`;
      status('lines').textContent = `${v.split('\n').length} 行`;
    }
    ta.addEventListener('keyup', updateStatus);
    ta.addEventListener('click', updateStatus);
    let lastVal = ta.value;
    ta.addEventListener('input', () => {
      if(ta.value !== lastVal){ undoStack.push(lastVal); if(undoStack.length > 200) undoStack.shift(); redoStack = []; lastVal = ta.value; }
      dirty = true;
      status('saved').textContent = '未保存';
      updateStatus();
      if(sheetMode) renderSheet();
      scheduleAutosave();
    });
    updateStatus();

    const scheduleAutosave = debounce(async () => {
      if(!filePath || !dirty) return;
      try{
        await fs.writeFile(filePath, ta.value, {});
        dirty = false;
        status('saved').textContent = '自动保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12:Settings.data.clock12 });
        bus.emit('fs-change');
      }catch(e){ status('saved').textContent = '保存失败'; }
    }, 1200);

    async function save(){
      if(!filePath){
        const name = await promptModal('另存为', '文件名', '未命名.txt');
        if(!name) return;
        filePath = '/桌面/' + name;
      }
      try{
        await fs.writeFile(filePath, ta.value, {});
        dirty = false;
        status('saved').textContent = '已保存';
        WM.setTitle(WM.focused, '记事本 · ' + fs.nameOf(filePath));
        Desktop.refresh(); bus.emit('fs-change');
        toast('已保存到 ' + filePath, 'ok');
      }catch(e){ toast('保存失败: ' + e.message, 'err'); }
    }

    root.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if(a === 'save') save();
      else if(a === 'undo'){ const v = undoStack.pop(); if(v !== undefined){ redoStack.push(ta.value); ta.value = v; lastVal = v; updateStatus(); if(sheetMode) renderSheet(); } }
      else if(a === 'redo'){ const v = redoStack.pop(); if(v !== undefined){ undoStack.push(ta.value); ta.value = v; lastVal = v; updateStatus(); if(sheetMode) renderSheet(); } }
      else if(a === 'bigger'){ fontSize = Math.min(28, fontSize + 1); ta.style.fontSize = fontSize + 'px'; }
      else if(a === 'smaller'){ fontSize = Math.max(9, fontSize - 1); ta.style.fontSize = fontSize + 'px'; }
      else if(a === 'import'){
        const inp = $('#filePicker'); inp.removeAttribute('accept'); inp.value = '';
        inp.onchange = async () => {
          const f = inp.files[0]; if(!f) return;
          ta.value = new TextDecoder('utf-8').decode(new Uint8Array(await f.arrayBuffer()));
          filePath = '/桌面/' + f.name;
          lastVal = ta.value; updateStatus();
          toast('已导入 ' + f.name, 'ok');
        };
        inp.click();
      }
      else if(a === 'export'){
        const blob = new Blob([ta.value], { type:'text/plain;charset=utf-8' });
        const a2 = el('a'); a2.href = URL.createObjectURL(blob);
        a2.download = filePath ? fs.nameOf(filePath) : '未命名.txt';
        a2.click(); setTimeout(() => URL.revokeObjectURL(a2.href), 6000);
      }
      else if(a === 'find'){
        const q = await promptModal('查找', '查找内容');
        if(q){
          const i = ta.value.indexOf(q);
          if(i >= 0){ ta.focus(); ta.setSelectionRange(i, i + q.length); }
          else toast('未找到', 'err');
        }
      }
    });
    root.querySelectorAll('[data-s]').forEach(b => {
      if(b.dataset.s === 'sheet' || b.dataset.s === 'text') b.onclick = () => setMode(b.dataset.s);
    });

    const win = WM.create({ title:'记事本', sub:filePath ? fs.nameOf(filePath) : '未命名', icon:ICONS.txt, appId:'notepad', w:Math.min(760, innerWidth-60), h:Math.min(540, innerHeight-80) });
    win.body.appendChild(root);
    win.onClose = () => { if(dirty && filePath) fs.writeFile(filePath, ta.value, {}).catch(()=>{}); };
    return win;
  }
};

/* ═══════════════════════════════════════════════════════════
   19. 压缩包（JSZip 懒加载）
   ═══════════════════════════════════════════════════════════ */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => res(true);
    s.onerror = () => rej(new Error('脚本加载失败: ' + src));
    document.head.appendChild(s);
    setTimeout(() => rej(new Error('脚本加载超时')), 15000);
  });
}
async function ensureJSZip(){
  if(window.JSZip) return window.JSZip;
  try{ await loadScript('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'); }
  catch(e){ await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'); }
  if(!window.JSZip) throw new Error('JSZip 加载失败，请检查网络');
  return window.JSZip;
}

/* JSZip DOS 时间 → 真实时间（修正时区偏差） */
function fixZipDate(date){
  if(!date) return Date.now();
  const d = date instanceof Date ? date : new Date(date);
  if(isNaN(d.getTime())) return Date.now();
  return d.getTime();
}

async function unzip(filePath, fileName, destDir){
  toast('正在解压 ' + fileName + '…');
  try{
    const bytes = await fs.readFile(filePath);
    const outDir = destDir + '/' + baseOf(fileName).replace(/\.tar$/i, '');
    if(!(await fs.exists(outDir))) await fs.mkdir(outDir);

    if(/\.zip$/i.test(extOf(fileName))){
      const JSZip = await ensureJSZip();
      const zip = await JSZip.loadAsync(bytes);
      const entries = Object.values(zip.files);
      for(const e of entries){
        const target = outDir + '/' + e.name;
        if(e.dir){ if(!(await fs.exists(target))) await fs.mkdir(target); continue; }
        const dir = fs.parentOf(target);
        if(!(await fs.exists(dir))) await fs.mkdirp(dir);
        const data = await e.async('uint8array');
        await fs.writeFile(target, data, { mtime: fixZipDate(e.date), ctime: fixZipDate(e.date) });
      }
    }else if(/(tar|tgz|gz)$/i.test(extOf(fileName))){
      const data = await untarNative(bytes, fileName);
      for(const f of data){
        const target = outDir + '/' + f.name;
        const dir = fs.parentOf(target);
        if(!(await fs.exists(dir))) await fs.mkdirp(dir);
        await fs.writeFile(target, f.data, { mtime: f.mtime, ctime: f.mtime });
      }
    }else if(/(7z|rar|bz2|xz|cab|arj|lzh|z|tbz2|txz)$/i.test(extOf(fileName))){
      // 7z-wasm 引擎：支持 7z / rar / bz2 / xz / cab 等扩展格式
      await extract7z(bytes, outDir, fileName);
    }else{
      throw new Error('暂不支持该压缩格式');
    }
    toast('解压完成 → ' + outDir, 'ok');
    Desktop.refresh(); bus.emit('fs-change');
  }catch(e){ toast('解压失败: ' + e.message, 'err'); }
}

/* 原生 TAR / GZIP 解析（零依赖） */
async function untarNative(bytes, name){
  let data = bytes;
  const u8 = bytes;
  if(u8[0] === 0x1f && u8[1] === 0x8b){
    data = new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  const out = [];
  const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  let off = 0;
  const str = (o, len) => {
    let s = '';
    for(let i = 0; i < len; i++){ const c = data[o + i]; if(!c) break; s += String.fromCharCode(c); }
    return s;
  };
  while(off + 512 <= data.length){
    const name2 = str(off, 100);
    if(!name2) break;
    const sizeOct = str(off + 124, 12).trim();
    const size = parseInt(sizeOct, 8) || 0;
    const mtime = (parseInt(str(off + 136, 12).trim(), 8) || 0) * 1000;
    const type = String.fromCharCode(data[off + 156]) || '0';
    const prefix = str(off + 345, 155);
    const full = prefix ? prefix + '/' + name2 : name2;
    if(type === '0' || type === '\0'){
      out.push({ name:full, data:data.slice(off + 512, off + 512 + size), mtime: mtime || Date.now() });
    }else if(type === '5'){
      out.push({ name:full + '/.keep', data:new Uint8Array(0), mtime: mtime || Date.now() });
    }
    off += 512 + Math.ceil(size / 512) * 512;
  }
  return out;
}

      <div class="calc-pad"></div>`;
    const exprEl = root.querySelector('.expr'), valEl = root.querySelector('.val');
    let expr = '', cur = '0';
    const keys = ['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','←','%','MC','MR','M+','='];
    const pad = root.querySelector('.calc-pad');
    let mem = 0;
    for(const k of keys){
      const b = el('button', 'calc-key' + (/[÷×−+%]/.test(k) ? ' op' : '') + (k === '=' ? ' eq' : ''));
      b.textContent = k;
      b.onclick = () => {
        if(k === 'C'){ expr = ''; cur = '0'; }
        else if(k === '←'){ cur = cur.length > 1 ? cur.slice(0, -1) : '0'; }
        else if(k === '='){
          try{
            const src = (expr + cur).replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
            const val = Function('"use strict";return(' + src + ')')();
            exprEl.textContent = expr + cur + ' =';
            cur = String(Number.isFinite(val) ? +val.toFixed(12) : '错误');
            expr = '';
            valEl.textContent = cur;
            return;
          }catch(e){ valEl.textContent = '错误'; return; }
        }
        else if(k === '±'){ cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; }
        else if(k === 'MC'){ mem = 0; }
        else if(k === 'MR'){ cur = String(mem); }
        else if(k === 'M+'){ mem += parseFloat(cur) || 0; }
        else if(/[÷×−+]/.test(k)){ expr += cur + k; cur = '0'; }
        else{ cur = cur === '0' && k !== '.' ? k : cur + k; }
        exprEl.textContent = expr;
        valEl.textContent = cur;
      };
      pad.appendChild(b);
    }
    const win = WM.create({ title:'计算器', icon:ICONS.calc, appId:'calc', w:320, h:480 });
    win.body.appendChild(root);
    return win;
  }
};
