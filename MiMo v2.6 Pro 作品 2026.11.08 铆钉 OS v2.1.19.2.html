APPS['manga'] = {
  id:'manga', name:'漫画阅读器', icon:ICONS.manga, cat:'媒体', keywords:'漫画 条漫 图片 阅读',
  async launch(args = {}){
    const path = args.path;
    const dir = fs.parentOf(path);
    let items = [];
    try{ items = await fs.readdir(dir); }
    catch(e){ toast('目录读取失败: ' + e.message, 'err'); return null; }

    const imgs = items.filter(i => !i.isDir && KIND.image(i.name)).sort((a, b) => naturalCompare(a.name, b.name));
    if(!imgs.length){ toast('该目录没有图片', 'err'); return null; }
    const startIdx = Math.max(0, imgs.findIndex(i => i.path === path));

    const root = el('div', 'manga');
    root.innerHTML = `
      <div class="np-bar">
        <button class="btn sm ghost" data-a="top">${ICONS.up}<span>回到顶部</span></button>
        <button class="btn sm ghost" data-a="prev">${ICONS.back}<span>上一张</span></button>
        <button class="btn sm ghost" data-a="next">${ICONS.forward}<span>下一张</span></button>
        <div style="flex:1"></div>
        <span class="mono" style="font-size:10px;color:var(--ink-dim)" data-s="pos">—</span>
        <button class="btn sm ghost" data-a="fitw">${ICONS.fit}<span>适应宽度</span></button>
        <button class="btn sm primary" data-a="full">${ICONS.full}<span>沉浸全屏</span></button>
        <button class="btn sm ghost" data-a="dl">${ICONS.download}<span>下载</span></button>
      </div>
      <div class="manga-scroll"></div>`;
    const scroller = root.querySelector('.manga-scroll');
    const posEl = root.querySelector('[data-s="pos"]');
    const exitBtn = el('button', 'manga-exit');
    exitBtn.innerHTML = ICONS.x;
    exitBtn.title = '退出全屏';
    document.body.appendChild(exitBtn);

    /* 并行读取、按序插入 */
    const slots = imgs.map((it, i) => {
      const wrap = el('div', 'manga-img');
      wrap.style.cssText = 'width:100%;aspect-ratio:2/3;background:#0a0a0a;position:relative;overflow:hidden';
      wrap.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center"><div class="loader"><div class="ring"></div><div class="txt">${escapeHtml(it.name)}</div></div></div>`;
      wrap.dataset.idx = i;
      scroller.appendChild(wrap);
      return wrap;
    });

    let loaded = 0, failed = 0;
    const readAll = imgs.map(async (it, i) => {
      try{
        const bytes = await fs.readFile(it.path);
        return { i, it, bytes };
      }catch(e){ failed++; return { i, it, bytes:null }; }
    });

    /* 按序渲染，避免并行回调打乱顺序 */
    (async () => {
      const results = await Promise.all(readAll);
      for(const r of results){
        const wrap = slots[r.i];
        if(!r.bytes){ wrap.innerHTML = `<div class="loader"><div class="txt" style="color:#555">${escapeHtml(r.it.name)} 读取失败</div></div>`; continue; }
        const url = URL.createObjectURL(new Blob([r.bytes], { type:r.it.mime || mimeOf(r.it.name, false) }));
        const img = new Image();
        img.className = 'manga-img';
        img.alt = r.it.name;
        img.decoding = 'async';
        img.onload = () => {
          // 固有宽高比骨架 → 撑开高度 → 补偿 scrollTop，避免跳动
          const before = scroller.scrollHeight;
          const wrapTop = wrap.offsetTop;
          wrap.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
          wrap.innerHTML = '';
          wrap.appendChild(img);
          const after = scroller.scrollHeight;
          const delta = after - before;
          if(delta && wrapTop < scroller.scrollTop) scroller.scrollTop += delta;
          loaded++;
          updatePos();
        };
        img.onerror = () => {
          wrap.innerHTML = `<div class="loader"><div class="txt" style="color:#555">${escapeHtml(r.it.name)}</div></div>`;
          failed++;
        };
        img.src = url;
      }
      if(failed) toast(`${failed} 张图片读取失败，已跳过`, 'err');
    })();

    function updatePos(){
      const mid = scroller.scrollTop + scroller.clientHeight * 0.35;
      let cur = 0;
      for(const s of slots){ if(s.offsetTop <= mid) cur = +s.dataset.idx; }
      posEl.textContent = `${cur + 1} / ${imgs.length} · ${escapeHtml(imgs[cur].name)}`;
    }
    scroller.addEventListener('scroll', () => { if(!scroller._dragging) updatePos(); }, { passive:true });

    const scrollToIdx = i => {
      const s = slots[Math.max(0, Math.min(slots.length - 1, i))];
      if(s) scroller.scrollTo({ top:s.offsetTop - 10, behavior:reducedMotion ? 'auto' : 'smooth' });
    };
    setTimeout(() => {
      const target = slots[startIdx];
      if(target) scroller.scrollTop = Math.max(0, target.offsetTop - 10);
      updatePos();
    }, 120);

    root.querySelector('[data-a="top"]').onclick = () => scroller.scrollTo({ top:0, behavior:'smooth' });
    root.querySelector('[data-a="prev"]').onclick = () => scrollToIdx(currentIdx() - 1);
    root.querySelector('[data-a="next"]').onclick = () => scrollToIdx(currentIdx() + 1);
    root.querySelector('[data-a="dl"]').onclick = () => exportPaths([imgs[startIdx].path]);
    root.querySelector('[data-a="fitw"]').onclick = () => {
      scroller.querySelectorAll('.manga-img').forEach(x => { x.style.maxWidth = '100%'; x.style.width = 'auto'; });
    };
    function currentIdx(){
      const mid = scroller.scrollTop + scroller.clientHeight * 0.35;
      let cur = 0;
      for(const s of slots){ if(s.offsetTop <= mid) cur = +s.dataset.idx; }
      return cur;
    }

    /* 双模拖拽：PC Pointer + 惯性滑行 */
    (function inertia(){
      let dragging = false, lastY = 0, vel = 0, raf = 0;
      const FRICTION = 0.96;
      scroller.addEventListener('pointerdown', e => {
        if(e.pointerType === 'touch') return;   // 移动端走原生合成器滚动
        if(e.button !== 0) return;
        dragging = true; scroller._dragging = true;
        lastY = e.clientY; vel = 0;
        scroller.setPointerCapture(e.pointerId);
        cancelAnimationFrame(raf);
      });
      scroller.addEventListener('pointermove', e => {
        if(!dragging) return;
        const dy = e.clientY - lastY;
        scroller.scrollTop -= dy;
        vel = -dy;
        lastY = e.clientY;
      });
      const end = () => {
        if(!dragging) return;
        dragging = false;
        const glide = () => {
          if(Math.abs(vel) < 0.35){ scroller._dragging = false; updatePos(); return; }
          scroller.scrollTop += vel;
          vel *= FRICTION;
          raf = requestAnimationFrame(glide);
        };
        raf = requestAnimationFrame(glide);
      };
      scroller.addEventListener('pointerup', end);
      scroller.addEventListener('pointercancel', end);
    })();

    /* 沉浸全屏 */
    let immersive = false, prevRect = null;
    const win = WM.create({ title:'漫画阅读器', sub:`${imgs.length} 页 · ${fs.nameOf(dir)}`, icon:ICONS.manga, appId:'manga', w:Math.min(720, innerWidth-60), h:Math.min(760, innerHeight-80) });
    win.el.classList.add('manga-win');
    win.body.appendChild(root);

    const setImmersive = on => {
      immersive = on;
      root.classList.toggle('immersive', on);
      document.body.classList.toggle('manga-full', on);
      if(on){
        prevRect = { left:win.el.style.left, top:win.el.style.top, width:win.el.style.width, height:win.el.style.height };
        // body.manga-full 已把 #desktop 撑满视口，窗口直接铺满即可
        Object.assign(win.el.style, { left:'0px', top:'0px', width:'100%', height:'100%' });
        win.el.style.zIndex = 9600;
        document.documentElement.requestFullscreen?.().catch(() => {});
      }else{
        if(document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
        if(prevRect) Object.assign(win.el.style, prevRect);
        win.el.style.zIndex = ++WM.z;
      }
      win.onResize && win.onResize();
    };
    root.querySelector('[data-a="full"]').onclick = () => setImmersive(!immersive);
    exitBtn.onclick = () => setImmersive(false);
    document.addEventListener('fullscreenchange', () => {
      if(!document.fullscreenElement && immersive) setImmersive(false);
    });

    win.onClose = () => { exitBtn.remove(); document.body.classList.remove('manga-full'); };
    return win;
  }
};

/* ═══════════════════════════════════════════════════════════

const CM_RES = {
  css:[
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css'
  ],
  js:[
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js'
  ],
  alt:'https://cdn.jsdelivr.net/npm/codemirror@5.65.16/'
};
function loadCSS(href){
  return new Promise((res, rej) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = href;
    l.onload = res; l.onerror = rej;
    document.head.appendChild(l);
    setTimeout(res, 8000);
  });
}
async function ensureCodeMirror(){
  if(window.CodeMirror) return window.CodeMirror;
  for(const href of CM_RES.css){ await loadCSS(href).catch(() => {}); }
  const bases = ['https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/', CM_RES.alt];
  for(const base of bases){
    try{
      for(const f of ['codemirror.min.js','mode/xml/xml.min.js','mode/css/css.min.js','mode/javascript/javascript.min.js','mode/htmlmixed/htmlmixed.min.js','mode/markdown/markdown.min.js']){
        await loadScript(base + f);
      }
      if(window.CodeMirror) return window.CodeMirror;
    }catch(e){ /* 尝试下一个 CDN */ }
  }
  throw new Error('CodeMirror 加载失败，请检查网络连接');
}

function modeForPath(p){
  const e = extOf(p);
  return ({ html:'htmlmixed', htm:'htmlmixed', css:'css', js:'javascript', mjs:'javascript',
    json:{ name:'javascript', json:true }, md:'markdown', markdown:'markdown',
    xml:'xml', svg:'xml', yml:'yaml', yaml:'yaml', txt:'text/plain' })[e] || 'text/plain';
}
const MODE_LABEL = m => {
  const n = typeof m === 'string' ? m : (m && m.name) || 'text';
  return ({ htmlmixed:'HTML', css:'CSS', javascript:'JavaScript', markdown:'Markdown', xml:'XML', yaml:'YAML' })[n] || n.toUpperCase();
};
const EXT_FOR_MODE = { htmlmixed:'html', css:'css', javascript:'js', markdown:'md', xml:'xml', yaml:'yaml', 'text/plain':'txt' };

/* 轻量格式化（HTML / CSS / JS / JSON） */
function formatCode(src, mode){
  const name = typeof mode === 'string' ? mode : mode.name;
  try{
    if(name === 'javascript' && mode.json) return JSON.stringify(JSON.parse(src), null, 2);
  }catch(e){}
  if(name === 'htmlmixed' || name === 'xml'){
    let out = '', indent = 0;
    const tokens = src.replace(/>\s*</g, '>\n<').split('\n');
    for(let t of tokens){
      t = t.trim();
      if(!t) continue;
      if(/^<\//.test(t)) indent = Math.max(0, indent - 1);
      out += '  '.repeat(indent) + t + '\n';
      if(/^<[^!?/][^>]*[^/]>$/.test(t) && !/^<(meta|link|img|br|hr|input|source|area|base|col|embed|param|track|wbr)\b/i.test(t)) indent++;
    }
    return out;
  }
  if(name === 'css'){
    let out = '', indent = 0;
    src.split('\n').forEach(line => {
      const t = line.trim();
      if(!t) return;
      if(/^}/.test(t)) indent = Math.max(0, indent - 1);
      out += '  '.repeat(indent) + t + '\n';
      if(/{\s*$/.test(t)) indent++;
    });
    return out;
  }
  if(name === 'javascript'){
    let out = '', indent = 0;
    src.split('\n').forEach(line => {
      const t = line.trim();
      if(!t) return;
      if(/^[}\])]/.test(t)) indent = Math.max(0, indent - 1);
      out += '  '.repeat(indent) + t + '\n';
      if(/[{\[(]\s*$/.test(t) && !/[}\])]\s*$/.test(t)) indent++;
    });
    return out;
  }
  return src;
}

      const start = isCol ? e.clientY : e.clientX;
      const mm = ev => {
        const d = (isCol ? ev.clientY : ev.clientX) - start;
        const pct = clamp((sz + d) / (isCol ? splitEl.clientHeight : splitEl.clientWidth) * 100, 12, 88);

        else { codePane.style.width = pct + '%'; codePane.style.flex = 'none'; }

      };
      const mu = () => { document.removeEventListener('pointermove', mm); document.removeEventListener('pointerup', mu); editor.refresh && editor.refresh(); };
      document.addEventListener('pointermove', mm);
      document.addEventListener('pointerup', mu);

    /* 查找替换 */
    function openFind(){
      if(root.querySelector('.findbar')) return;

      bar.innerHTML = `
        <input class="input" placeholder="查找" style="width:150px" data-f="q">

        <button class="btn sm ghost" data-f="rep">替换</button>
        <button class="btn sm ghost" data-f="all">全部替换</button>
        <button class="btn sm danger" data-f="x">关闭</button>`;
      codePane.appendChild(bar);
      const q = bar.querySelector('[data-f="q"]');
      q.focus();
      bar.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
        const a = b.dataset.f;
        const needle = q.value, repl = bar.querySelector('[data-f="r"]').value;
        if(a === 'x') bar.remove();
        else if(!needle) return;
        else if(a === 'next'){
          const val = editor.getValue();
          let startAt = 0;
          if(editor.indexFromPos && editor.getCursor) startAt = editor.indexFromPos(editor.getCursor());
          else if(editor.selectionStart != null) startAt = editor.selectionStart;
          let idx = val.indexOf(needle, startAt + (editor._lastFind === needle ? 1 : 0));
          if(idx < 0) idx = val.indexOf(needle);
          if(idx < 0){ toast('未找到「' + needle + '」', 'err'); return; }
          editor._lastFind = needle;
          if(editor.setSelection && editor.posFromIndex){
            const a1 = editor.posFromIndex(idx), a2 = editor.posFromIndex(idx + needle.length);
            editor.setSelection(a1, a2);
            editor.scrollIntoView && editor.scrollIntoView({ from:a1, to:a2 }, 90);
          }else if(editor.setSelectionRange){
            editor.setSelectionRange(idx, idx + needle.length);
          }
          editor.focus && editor.focus();
        }
        else if(a === 'rep' || a === 'all'){
          if(a === 'all'){
            const n = editor.getValue().split(needle).length - 1;
            editor.setValue(editor.getValue().split(needle).join(repl));
            toast(`已替换 ${n} 处`, 'ok');
          }else{
            const val = editor.getValue();
            let startAt = 0;
            if(editor.indexFromPos && editor.getCursor) startAt = editor.indexFromPos(editor.getCursor());
            const idx = val.indexOf(needle, startAt);
            if(idx >= 0) editor.setValue(val.slice(0, idx) + repl + val.slice(idx + needle.length));

        const name = state.path ? fs.nameOf(state.path) : await promptModal('存入虚拟桌面', '文件名', '文档.html');

        const p = '/桌面/' + name;

        state.path = p; state.dir = '/桌面';
        Desktop.refresh(); bus.emit('fs-change');
        toast('已存入虚拟桌面: ' + name, 'ok');
      }
      else if(a === 'clear'){ editor.setValue(''); refreshPreview(); toast('已清空', 'ok'); }
      else if(a === 'dir'){
        state.dir2 = splitEl.classList.contains('col') ? 'row' : 'col';
        splitEl.classList.toggle('col', state.dir2 === 'col');
        editor.refresh && editor.refresh();
      }
    });
    root.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      state.layout = b.dataset.l;
      root.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b));
      // 先清掉拖拽留下的尺寸，否则单栏模式会残留一块空白
      codePane.style.flex = ''; codePane.style.width = ''; codePane.style.height = '';
      prevPane.style.flex = ''; prevPane.style.width = ''; prevPane.style.height = '';
      codePane.style.display = state.layout === 'preview' ? 'none' : 'flex';
      prevPane.style.display = state.layout === 'code' ? 'none' : 'flex';
      grip.style.display = state.layout === 'split' ? 'block' : 'none';
      editor.refresh && editor.refresh();
      if(state.layout !== 'code') refreshPreview();

    root.querySelector(`[data-l="split"]`).classList.add('on');

    const modeSel = root.querySelector('[data-a="mode"]');
    modeSel.value = typeof state.mode === 'string' && state.mode !== 'json' ? state.mode : 'json';
    modeSel.onchange = () => {
      const v = modeSel.value;
      state.mode = v === 'json' ? { name:'javascript', json:true } : v;
      if(editor.setOption) editor.setOption('mode', state.mode);
      updateStatus(); refreshPreview();
    };
    const imSel = root.querySelector('[data-a="inputmode"]');
    imSel.onchange = () => {
      state.inputMode = imSel.value;
      const v = state.inputMode === 'pc' ? 'textarea' : state.inputMode === 'mobile' ? 'contenteditable' : CM?.defaults.inputStyle || 'textarea';
      if(editor.setOption) editor.setOption('inputStyle', v);
      editor.refresh && editor.refresh();
      updateStatus();
      toast('输入模式: ' + ({ auto:'自动', pc:'电脑', mobile:'手机' })[state.inputMode]);
    };

    /* 快捷键 */
    const keyHandler = e => {
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); save(); }
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); openFind(); }
    };
    root.addEventListener('keydown', keyHandler);

    const win = WM.create({
      title:'代码编辑器', sub:state.path ? fs.nameOf(state.path) : '未命名', icon:ICONS.code, appId:'code',
      w:Math.min(1120, innerWidth - 40), h:Math.min(700, innerHeight - 60)
    });
    win.body.appendChild(root);
    win.onResize = () => editor.refresh && editor.refresh();
    win.onClose = () => {
      root.removeEventListener('keydown', keyHandler);
      if(editor && editor.toTextArea) editor.toTextArea();
      editor = null;
      root.querySelector('.findbar')?.remove();
    };
    setTimeout(() => { editor.refresh && editor.refresh(); editor.focus && editor.focus(); }, 120);
    return win;
  }
};

let customWallpaperUrl = null;
function applyWallpaper(){
  const w = $('#wallpaper');
  const id = Settings.data.wallpaper;
  const wp = WALLPAPERS.find(x => x.id === id);
  w.classList.remove('wp-clear');
  if(id === 'custom' && customWallpaperUrl){
    w.style.background = `url(${customWallpaperUrl}) center/cover no-repeat`;
    w.classList.add('wp-clear');
    return;
  }
  if(wp){
    if(wp.url){
      // 多层背景：图片在上、CSS 渐变垫底 —— 图片加载失败自动露出渐变，永远不会留空洞
      w.style.background = 'none';
      w.style.backgroundImage = `url("${wp.url}"), ${wp.css}`;
      w.style.backgroundSize = 'cover, cover';
      w.style.backgroundPosition = 'center, center';
      w.style.backgroundRepeat = 'no-repeat';
      w.classList.add('wp-clear');
    }else{
      w.style.background = wp.css;
    }
    return;
  }
  w.style.background = WALLPAPERS[0].css;
}

/* ═══════════════════════════════════════════════════════════
   26.5 7z-wasm 解压引擎（按需加载，失败自动降级）
   ═══════════════════════════════════════════════════════════ */
let _sevenZip = null;
async function ensure7z(){
  if(_sevenZip) return _sevenZip;
  const mod = await import('https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.es6.min.js');
  const SevenZip = mod.default || mod;
  _sevenZip = await SevenZip({
    wasmUrl:'https://cdn.jsdelivr.net/npm/7z-wasm@1.2.0/7zz.wasm',
    print:() => {}, printErr:() => {}
  });
  return _sevenZip;
}
async function extract7z(bytes, outDir, baseName){
  const sz = await ensure7z();
  const inName = '/in.' + (extOf(baseName) || '7z');
  try{ sz.FS.unlink(inName); }catch(e){}
  sz.FS.writeFile(inName, bytes);
  const outDirV = '/out';
  try{ sz.FS.mkdir(outDirV); }catch(e){}
  sz.callMain(['x', inName, '-o' + outDirV, '-y']);
  const walk = async (vpath, dest) => {
    const entries = sz.FS.readdir(vpath).filter(n => n !== '.' && n !== '..');
    for(const name of entries){
      const full = vpath + '/' + name;
      const st = sz.FS.stat(full);
      if(sz.FS.isDir(st.mode)){
        const d = dest + '/' + name;
        if(!(await fs.exists(d))) await fs.mkdir(d);
        await walk(full, d);
      }else{
        const data = sz.FS.readFile(full);
        await fs.writeFile(dest + '/' + name, new Uint8Array(data), { mtime: Math.floor(st.mtime ? new Date(st.mtime).getTime() : Date.now()) });
      }
    }
  };
  await walk(outDirV, outDir);
}

    root.innerHTML = `

        <button class="btn sm primary" data-a="pick">${ICONS.upload}<span>选择镜像文件</span></button>
        <button class="btn sm" data-a="boot">${ICONS.play}<span>启动</span></button>
        <button class="btn sm ghost" data-a="reset">${ICONS.refresh}<span>重置</span></button>
        <button class="btn sm ghost" data-a="mouse">${ICONS.keyboard}<span>锁定鼠标</span></button>
        <button class="btn sm ghost" data-a="full">${ICONS.full}<span>全屏</span></button>
        <div style="flex:1"></div>
        <span class="mono" style="font-size:10px;color:var(--ink-dim)" data-s="img">未选择镜像</span>
      </div>
      <div class="progress"><i style="width:0%"></i></div>
      <div style="flex:1;min-height:0;display:grid;place-items:center;background:#000;position:relative">
        <div id="screen_container" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">
          <div style="white-space:pre;font:14px var(--font-mono);line-height:14px;color:#c7d0d6"></div>
          <canvas style="max-width:100%;max-height:100%;display:none"></canvas>
        </div>
        <div class="br-mask"><div class="loader"><div class="txt" style="text-align:center;line-height:2">
          选择本地 .iso / .img 镜像后点击「启动」<br>
          <span style="color:var(--amber)">禁止从 URL 直接加载镜像，避免跨域黑屏</span></div></div></div>
      </div>`;
    const bar = root.querySelector('.np-bar');
    const mask = root.querySelector('.br-mask');
    const progress = root.querySelector('.progress i');
    const sc = root.querySelector('#screen_container');
    const statusEl = root.querySelector('[data-s="img"]');
    let imgBuffer = null, imgName = '', emulator = null;

    bar.querySelector('[data-a="pick"]').onclick = () => {
      const inp = $('#filePicker'); inp.removeAttribute('accept'); inp.value = '';
      inp.onchange = async () => {
        const f = inp.files[0]; if(!f) return;
        imgBuffer = await f.arrayBuffer();
        imgName = f.name;
        statusEl.textContent = `${f.name} · ${fmtSize(f.size)}`;
        toast('镜像已就绪，点击「启动」', 'ok');
      };
      inp.click();
    };

    bar.querySelector('[data-a="boot"]').onclick = async () => {
      if(!imgBuffer){ toast('请先选择镜像文件', 'err'); return; }
      try{
        progress.style.width = '12%';
        await ensureV86();
        progress.style.width = '45%';
        const ext = extOf(imgName);
        const mountOpts = {};
        const buf = imgBuffer;
        // 按后缀正确挂载：iso→cdrom，img/fda/bin→fda，其余→hda
        if(ext === 'iso') mountOpts.cdrom = { buffer:buf };
        else if(/^(img|fda|bin|ima)$/i.test(ext)) mountOpts.fda = { buffer:buf };
        else mountOpts.hda = { buffer:buf };

        const Ctor = window.V86Starter || window.V86;
        emulator = new Ctor({
          wasm_path:V86_RES.wasm,
          memory_size:128 * 1024 * 1024,
          vga_memory_size:8 * 1024 * 1024,
          screen_container:sc,
          bios:{ url:V86_RES.bios },
          vga_bios:{ url:V86_RES.vga },
          autostart:true,
          ...mountOpts
        });
        emulator.add_listener?.('emulator-ready', () => {
          progress.style.width = '100%';
          mask.style.display = 'none';
          sc.querySelector('canvas').style.display = 'block';
          toast('虚拟机已启动', 'ok');
        });
        setTimeout(() => { mask.style.display = 'none'; progress.style.width = '100%'; }, 4000);
      }catch(e){
        progress.style.width = '0%';
        toast('虚拟机启动失败: ' + e.message, 'err');
      }
    };
    bar.querySelector('[data-a="reset"]').onclick = () => { try{ emulator?.restart?.(); }catch(e){} };
    bar.querySelector('[data-a="mouse"]').onclick = () => {
      try{
        emulator?.lock_mouse?.();
        sc.querySelector('canvas')?.requestPointerLock?.();
        toast('鼠标已锁定，按 Esc 释放', 'ok');
      }catch(e){ toast('鼠标锁定失败', 'err'); }
    };
    bar.querySelector('[data-a="full"]').onclick = () => {
      sc.requestFullscreen?.().catch(() => {});
    };

    const win = WM.create({ title:'虚拟机', icon:ICONS.monitor, appId:'vm', w:Math.min(880, innerWidth-60), h:Math.min(620, innerHeight-80) });
    win.body.appendChild(root);
    win.onClose = () => { try{ emulator?.destroy?.(); }catch(e){} emulator = null; };
    return win;
  }
};

/* ═══════════════════════════════════════════════════════════
   27. 应用设置到 DOM
   ═══════════════════════════════════════════════════════════ */
function applySettings(){
  const d = document.documentElement;
  d.dataset.theme = Settings.data.theme;
  d.style.setProperty('--amber', Settings.data.accent);
  const accentMap = {
    '#ff9d2e':['#ffc27a','#c96f12'], '#5ee89b':['#9df3c6','#2f9c62'],
    '#e5484d':['#ff8b8e','#a5272b'], '#57b6ff':['#93d0ff','#2c7bc4'],
    '#ffc27a':['#ffe0b8','#c98d3c'], '#c7d0d6':['#eaf0f3','#8a949b'],
    '#b06cff':['#cfa8ff','#7c3fc2'], '#00c2a8':['#5fe8d3','#00806f']
  };
  const steps = accentMap[Settings.data.accent] || accentMap['#ff9d2e'];
  d.style.setProperty('--amber-lt', steps[0]);
  d.style.setProperty('--amber-dk', steps[1]);
  d.style.setProperty('--amber-glow', hexToRgba(Settings.data.accent, 0.18));
  d.style.setProperty('--radius', Settings.data.radius + 'px');

  const rail = $('#rail');
  const side = Settings.data.railSide || 'left';
  d.dataset.rail = side;
  const thick = Settings.data.railWidth || 68;
  rail.style.width = '';
  rail.style.height = '';
  if(side === 'left' || side === 'right'){
    d.style.setProperty('--rail-w', thick + 'px');
    d.style.setProperty('--rail-h', '62px');
  }else{
    d.style.setProperty('--rail-w', '56px');
    d.style.setProperty('--rail-h', (innerWidth <= 880 ? 60 : thick) + 'px');
  }

  const heights = { compact:30, normal:34, comfortable:40 };
  let tbH = heights[Settings.data.density] || 34;
  if(innerWidth <= 880) tbH = Math.max(42, tbH);   // 移动端加高标题栏，保证可拖拽
  d.style.setProperty('--titlebar-h', tbH + 'px');

  $('#deskGrid').style.display = Settings.data.showGrid ? 'block' : 'none';
  document.body.style.setProperty('--anim', Settings.data.animations ? '1' : '0');
  if(!Settings.data.animations) document.body.classList.add('no-anim');
  else document.body.classList.remove('no-anim');
  applyWallpaper();
  tickClock();
}
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
}

/* ═══════════════════════════════════════════════════════════
   28. 全局事件
   ═══════════════════════════════════════════════════════════ */
function bindGlobal(){
  /* Aero Peek 保险：任何点击 / 失焦 / 指针离开导轨都立即恢复实体状态 */
  document.addEventListener('pointerdown', () => setPeek(false), true);
  addEventListener('blur', () => setPeek(false));
  let peekRaf = 0;
  addEventListener('pointermove', e => {
    if(!document.body.classList.contains('peek') || peekRaf) return;
    const t = e.target;
    peekRaf = requestAnimationFrame(() => {
      peekRaf = 0;
      if(!t.closest || !t.closest('#rail')) setPeek(false);
    });
  }, { passive:true });

  $('#btnStart').onclick = toggleStart;
  $('#btnExplorer').onclick = () => openApp('explorer', { path:'/桌面' });
  $('#btnSettings').onclick = () => { closeStart(); openApp('settings'); };
  $('#btnPower').onclick = async () => {
    closeStart();
    const ok = await modal({
      title:'关机', body:'将关闭所有窗口并返回到系统初始状态。',
      buttons:[{ label:'取消', value:false, kind:'ghost' }, { label:'关机', value:true, kind:'danger' }]
    });
    if(ok){ WM.wins.forEach(w => WM.close(w.id)); toast('系统已关闭 — 刷新页面可重新启动', 'ok'); }
  };
  $('#smSearch').addEventListener('input', e => renderStartApps(e.target.value));
  $('#railClock').onclick = openCalendar;

  let peekTimer = null;
  const showDeskBtn = $('#btnShowDesk');
  showDeskBtn.addEventListener('mouseenter', () => {
    clearTimeout(peekTimer);
    peekTimer = setTimeout(() => setPeek(true), 260);
  });
  showDeskBtn.addEventListener('mouseleave', () => {
    clearTimeout(peekTimer);
    setPeek(false);
  });
  $('#btnShowDesk').onclick = () => {
    const all = Array.from(WM.wins.values());
    const anyVisible = all.some(w => !w.minimized);
    all.forEach(w => anyVisible ? WM.minimize(w.id) : WM.restore(w.id));
  };

  const desk = $('#desktop');
  desk.addEventListener('contextmenu', e => {
    if(e.target.closest('.win') || e.target.closest('.dicon')) return;
    e.preventDefault();
    desktopMenu(e.clientX, e.clientY);
  });
  desk.addEventListener('click', e => {
    if(e.target === $('#deskGrid') || e.target === desk || e.target === Desktop.layer) Desktop.clearSelection();
  });
  bindDropTarget(desk, async (entries, e, files) => {
    toast('正在导入到桌面…');
    let out = [];
    if(entries) out = await importEntries(entries, '/桌面');
    else out = await importFiles(files, '/桌面');
    toast(`已导入 ${out.length} 个项目`, 'ok');
    Desktop.refresh(); bus.emit('fs-change');
  }, async (internal, e) => {
    const r = desk.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / 12) * 12;
    const y = Math.round((e.clientY - r.top) / 12) * 12;
    const node = Array.from(Desktop.layer.querySelectorAll('[data-path]')).find(n => n.dataset.path === internal);
    if(node && node.parentNode === Desktop.layer){
      node.style.left = clamp(x, 0, r.width - 90) + 'px';
      node.style.top = clamp(y, 0, r.height - 90) + 'px';
      Desktop.savePos(internal, node);
    }
  });

  /* 键盘快捷键 */
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.closest('.CodeMirror');
    if(e.key === 'F11'){ e.preventDefault(); toggleFullscreen(); }
    if(e.key === 'F5' && !typing){ e.preventDefault(); Desktop.refresh(); toast('桌面已刷新', 'ok'); }
    if(e.key === 'Escape'){
      hideContext(); closeStart();
      const f = document.querySelector('.findbar'); if(f) f.remove();
    }
    if(typing) return;
    if(e.key === 'Delete'){
      const sel = Array.from(Desktop.layer.querySelectorAll('.dicon.selected')).map(n => n.dataset.path);
      if(sel.length) deletePaths(sel);
    }
    if(e.key === 'F2'){
      const sel = Desktop.layer.querySelector('.dicon.selected');
      if(sel) Desktop.renameItem({ path:sel.dataset.path, name:sel.querySelector('.lbl').textContent });
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a'){
      e.preventDefault();
      Desktop.layer.querySelectorAll('.dicon').forEach(n => n.classList.add('selected'));
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v'){
      const sel = Desktop.layer.querySelector('.dicon.selected');
      Clipboard.paste('/桌面').then(out => { if(out.length){ toast(`已粘贴 ${out.length} 项`, 'ok'); Desktop.refresh(); } });
    }
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c'){
      const sel = Array.from(Desktop.layer.querySelectorAll('.dicon.selected')).map(n => n.dataset.path);
      if(sel.length){ Clipboard.copy(sel); toast('已复制 ' + sel.length + ' 项'); }
    }
  });

  /* 触屏长按：桌面空白处 → 桌面菜单（项目级长按已在各处单独绑定） */
  bindLongPress(Desktop.layer, pos => desktopMenu(pos.clientX, pos.clientY), '.dicon');

  // 文件系统变化 → 桌面 + 所有已打开的资源管理器窗口同步刷新（导入后不再"卡住"）
  bus.on('fs-change', debounce(() => {
    Desktop.refresh();
    for(const w of WM.wins.values()){
      if(w.app && typeof w.app.refresh === 'function'){ try{ w.app.refresh(); }catch(e){} }
    }
  }, 200));

  addEventListener('resize', debounce(() => {
    applySettings();
    for(const w of WM.wins.values()){
      const d = $('#desktop').getBoundingClientRect();
      const r = w.el.getBoundingClientRect();
      if(w.maximized){ Object.assign(w.el.style, { left:'0px', top:'0px', width:d.width+'px', height:d.height+'px' }); }
      else{
        const maxW = d.width - 12, maxH = d.height - 12;
        if(w.el.offsetWidth > maxW) w.el.style.width = maxW + 'px';
        if(w.el.offsetHeight > maxH) w.el.style.height = maxH + 'px';
        const l = parseFloat(w.el.style.left) || 0, t = parseFloat(w.el.style.top) || 0;
        w.el.style.left = clamp(l, -w.el.offsetWidth + 90, d.width - 90) + 'px';
        w.el.style.top  = clamp(t, 0, Math.max(0, d.height - 60)) + 'px';
      }
      w.onResize && w.onResize();
    }
  }, 180));
}

/* ═══════════════════════════════════════════════════════════
   29. 启动（无假加载动画，直接进入桌面）
   ═══════════════════════════════════════════════════════════ */
(async function boot(){
  try{
    await Settings.load();
    await fs.init();
    fs.defaultBackend = Settings.data.defaultBackend || (OPFSB.ok ? 'opfs' : 'idb');
  }catch(e){
    console.error('初始化失败', e);
    toast('文件系统初始化失败: ' + e.message, 'err', 6000);
  }

  applySettings();
  bindGlobal();
  tickClock();
  renderRailApps();
  await Desktop.refresh();
  renderStartApps();

  $('#smFsInfo').textContent = `FS · ${OPFSB.ok ? 'OPFS + IndexedDB' : 'IndexedDB'} · ${fs.meta.size} 节点`;

  // 之前上传的自定义壁纸恢复
  if(Settings.data.customWallpaper){
    try{
      const blob = await fs.readBlob(Settings.data.customWallpaper);
      customWallpaperUrl = URL.createObjectURL(blob);
      if(Settings.data.wallpaper === 'custom') applyWallpaper();
    }catch(e){}
  }

  // 恢复本地挂载提示
  setTimeout(() => {
    if(!IS_TOUCH && window.showDirectoryPicker){
      toast('提示：本地文件夹挂载需每次会话重新授权，可在「设置 → 本地挂载」中重新连接', '', 5200);
    }
  }, 1600);
})();

</script>
